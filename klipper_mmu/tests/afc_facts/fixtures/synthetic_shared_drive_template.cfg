# Synthetic shared-drive AFC template (not from any real vendor), shaped
# like ViViD/Claymore: one drive_stepper and one selector_stepper for the
# whole unit, four [AFC_lane laneN] sections (not [AFC_stepper ...]) for the
# actual lanes.

[AFC_vivid Synth_2]
hub: Synth_2
extruder: extruder
drive_stepper: Synth_2_drive
selector_stepper: Synth_2_selector
long_moves_speed: 120
long_moves_accel: 50

[AFC_stepper Synth_2_drive]
unit: Synth_2
step_pin: Synth_2:MDRV_STEP
dir_pin: Synth_2:MDRV_DIR
enable_pin: !Synth_2:MDRV_EN
microsteps: 16
rotation_distance: 360
gear_ratio: 43:1

[tmc2209 AFC_stepper Synth_2_drive]
uart_pin: Synth_2:MDRV_UART
uart_address: 0
run_current: 0.8
sense_resistor: 0.110

[AFC_stepper Synth_2_selector]
unit: Synth_2
step_pin: Synth_2:MSEL_STEP
dir_pin: Synth_2:MSEL_DIR
enable_pin: !Synth_2:MSEL_EN
microsteps: 16
rotation_distance: 400
gear_ratio: 2.5:1

[AFC_lane lane1]
unit: Synth_2:1
dist_hub: 2000
load: Synth_2_buffer:LOAD1
prep: Synth_2:PREP1
selector: !Synth_2:SEL1

[AFC_lane lane2]
unit: Synth_2:2
dist_hub: 2000
load: Synth_2_buffer:LOAD2
prep: Synth_2:PREP2
selector: !Synth_2:SEL2

[AFC_lane lane3]
unit: Synth_2:3
dist_hub: 2000
load: Synth_2_buffer:LOAD3
prep: Synth_2:PREP3
selector: !Synth_2:SEL3

[AFC_lane lane4]
unit: Synth_2:4
dist_hub: 2000
load: Synth_2_buffer:LOAD4
prep: Synth_2:PREP4
selector: !Synth_2:SEL4

[AFC_buffer Synth_2_buffer]
advance_pin: Synth_2_buffer:ADV
trailing_pin: Synth_2_buffer:TRAIL

[AFC_hub Synth_2]
afc_bowden_length: 2000
switch_pin: virtual
