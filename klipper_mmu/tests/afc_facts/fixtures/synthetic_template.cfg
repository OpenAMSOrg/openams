# Synthetic AFC template (not from any real vendor) for afc_facts tests.
# Two lanes, a virtual hub, and a switched buffer.

[AFC_BoxTurtle Synth_1]
hub: Synth_1
extruder: extruder
long_moves_speed: 100
long_moves_accel: 50

[AFC_stepper lane1]
unit: Synth_1:1
step_pin: Synth_1:M1_STEP
dir_pin: Synth_1:M1_DIR
enable_pin: !Synth_1:M1_EN
dist_hub: 200
park_dist: 10
prep: ^!Synth_1:TRG1
load: ^Synth_1:EXT1

[tmc2209 AFC_stepper lane1]
uart_pin: Synth_1:M1_UART
uart_address: 0
run_current: 0.8
sense_resistor: 0.110

[AFC_stepper lane2]
unit: Synth_1:2
step_pin: Synth_1:M2_STEP
dir_pin: Synth_1:M2_DIR
enable_pin: !Synth_1:M2_EN
dist_hub: 210
park_dist: 10
prep: ^!Synth_1:TRG2
load: ^Synth_1:EXT2

[AFC_hub Synth_1]
switch_pin: virtual
afc_bowden_length: 500
hub_clear_move_dis: 5

[AFC_buffer Synth_1_buffer]
advance_pin: ^Synth_1:BUFFER_ADV
trailing_pin: ^Synth_1:BUFFER_TRL
