# Synthetic board_pins alias file matching synthetic_template.cfg, in the
# multi-pair-per-line style real AFC_Lite.cfg uses.
[board_pins Synth_1]
mcu: Synth_1
aliases:
    M1_STEP=PA0	, M1_DIR=PA1	, M1_EN=PA2	, M1_UART=PA3	,
    M2_STEP=PA4	, M2_DIR=PA5	, M2_EN=PA6	, M2_UART=PA7	,
    TRG1=PB0	, EXT1=PB1	,
    TRG2=PB2	, EXT2=PB3	,
    BUFFER_ADV=PB5	, BUFFER_TRL=PB6	,
