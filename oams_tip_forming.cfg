# OpenAMS tip forming for printers without a filament cutter.
#
# EXPERIMENTAL AND UNSUPPORTED. A cutter is the reliable way to unload; tip
# forming depends on the hotend, the extruder, the filament and its
# temperature, and a bad tip can jam the PTFE path or the next load. Use it
# only where a cutter cannot be fitted, and tune it on your own machine.
#
# Requires a unit with a reverse follower (AMS_CAP_REVERSE_FOLLOWER=1): the
# toolhead buffer takes only ~15 mm, so the unit must pull the filament back
# while the extruder retracts, or the extruder skips. The OpenAMS unload
# enables the reverse follower before its cut step.
#
# Use: include this file after oams_macros.cfg, then make the cut step form
# a tip, in your own printer config:
#
#   [gcode_macro OAMS_CUT]
#   variable_label: "Form tip"           # how the displays name the step
#   gcode:
#       OAMS_FORM_TIP MATERIAL=<the loaded material>
#
# and in [gcode_macro _oams_macro_variables]:
#   variable_retract_length: 0            # nothing to retract before a cut
#   variable_extrusion_unload_length: 48  # from the parked tip past the gears
#
# Distances below are filament retracted from the printing position, i.e.
# the tip's height above the nozzle once it has separated. The tip ends
# parked at cool_to; extrusion_unload_length must then take it past the
# extruder's upper gear plus a margin (gear height - cool_to + ~10 mm).
#
# Profiles: one per material; OAMS_FORM_TIP MATERIAL=<name> picks one (default
# default_material), and any key can be overridden on the command line, e.g.
# OAMS_FORM_TIP DIP_TO=19 TEMP=198. The PLA profile was tuned on a TZ V6
# (V6 geometry) with a 5:1 BMG-gear extruder whose upper gear is ~84 mm above
# the nozzle; treat it as a starting point for other hotends.

[gcode_macro _oams_tip_forming]
variable_default_material: 'PLA'
# Two styles. "u1" (the default profiles) follows the Snapmaker U1's own
# unload (Snapmaker/u1-klipper lava/fluidd.cfg CONTROL_RETRACT_ACTION, also
# AFC's U1 template): at print temperature, a fast pull out of the melt
# zone, a slow crawl that lets the neck freeze under tension and snap
# instead of drawing a hair, a re-melt dip back down to the nozzle, a second
# fast pull and a slower final crawl. No cooling strokes. The U1 rams 30 mm
# because it unloads over a purge bin; this keeps the 5 mm ram, and dips to
# 2 mm above the nozzle instead of all the way. "classic" is the earlier
# Prusa-style recipe (ram, separate, cooling strokes, skinnydip): PLA uses it
# (it tipped better than the U1 style on this printer), ABS_CLASSIC keeps it
# for ABS.
variable_profiles: {
    # PLA on the U1 style, not the default: at the U1's own crawls (0.83/0.42
    # mm/s) and a dip to 2 mm the tip kept a beard and a small molten globule;
    # slower crawls (0.5/0.25) and a dip to 8 mm were no clear improvement.
    # PLA uses the classic recipe below; MATERIAL=PLA_U1 runs this one.
    'PLA_U1': {
        'style': 'u1', 'temp': 210,
        'ram': [[0.6, 1.0], [0.8, 1.6], [1.0, 2.2], [1.2, 2.8], [1.4, 3.4]],
        'pull_mm': 35.0, 'pull_speed': 50.0,
        'crawl_mm': 5.0, 'crawl_speed': 0.5,
        'dip_to': 8.0, 'dip_first_mm': 25.0, 'dip_first_speed': 16.7, 'dip_rest_speed': 25.0,
        'pull2_speed': 55.0, 'final_crawl_mm': 5.0, 'final_crawl_speed': 0.25,
        'park_to': 50.0, 'park_speed': 25.0, 'fan_ms': 0, 'set_ms': 0
    },
    'ABS': {
        'style': 'u1', 'temp': 255,
        'ram': [[0.6, 1.0], [0.8, 1.6], [1.0, 2.2], [1.2, 2.8], [1.4, 3.4]],
        'pull_mm': 35.0, 'pull_speed': 50.0,
        'crawl_mm': 5.0, 'crawl_speed': 0.83,
        'dip_to': 2.0, 'dip_first_mm': 25.0, 'dip_first_speed': 6.7, 'dip_rest_speed': 15.0,
        'pull2_speed': 55.0, 'final_crawl_mm': 5.0, 'final_crawl_speed': 0.83,
        'park_to': 50.0, 'park_speed': 25.0, 'fan_ms': 0, 'set_ms': 0
    },
    # PLA: the classic recipe at 192 C, the best PLA tip so far (a very thin
    # beard). ABS_CLASSIC: 230 C (a good first tip at 240 C, a very thin
    # beard); ABS itself tips better on the U1 style above.
    'PLA': {
        'style': 'classic', 'temp': 192,
        'ram': [[0.6, 1.0], [0.8, 1.6], [1.0, 2.2], [1.2, 2.8], [1.4, 3.4]],
        'sep_fast_mm': 15.0, 'sep_fast_speed': 40.0, 'sep_slow_speed': 20.0,
        'cool_from': 30.0, 'cool_to': 50.0, 'cool_moves': 2,
        'cool_speed_start': 10.0, 'cool_speed_end': 20.0,
        'dip_to': 18.0, 'dip_in_speed': 30.0, 'dip_pause_ms': 0,
        'dip_snap_mm': 15.0, 'dip_snap_speed': 55.0, 'dip_out_speed': 20.0,
        'set_ms': 1000
    },
    'ABS_CLASSIC': {
        'style': 'classic', 'temp': 230,
        'ram': [[0.6, 1.0], [0.8, 1.6], [1.0, 2.2], [1.2, 2.8], [1.4, 3.4]],
        'sep_fast_mm': 15.0, 'sep_fast_speed': 40.0, 'sep_slow_speed': 20.0,
        'cool_from': 30.0, 'cool_to': 50.0, 'cool_moves': 2,
        'cool_speed_start': 10.0, 'cool_speed_end': 20.0,
        'dip_to': 18.0, 'dip_in_speed': 30.0, 'dip_pause_ms': 0,
        'dip_snap_mm': 15.0, 'dip_snap_speed': 55.0, 'dip_out_speed': 20.0,
        'set_ms': 1000
    }
  }
gcode:


[gcode_macro OAMS_FORM_TIP]
description: EXPERIMENTAL: form a filament tip in place (no cutter); see oams_tip_forming.cfg
gcode:
    {% set cfg = printer['gcode_macro _oams_tip_forming'] %}
    {% set material = params.MATERIAL|default(cfg.default_material)|upper %}
    {% if material not in cfg.profiles %}
      { action_raise_error("OAMS_FORM_TIP: no tip profile for %s (have: %s)"
                           % (material, cfg.profiles.keys()|join(', '))) }
    {% endif %}
    {% set base = cfg.profiles[material] %}
    {% set p = {} %}
    {% for key, value in base.items() %}
      {% set _ = p.update({key: params[key|upper]|default(value)}) %}
    {% endfor %}
    {% set extruder = printer.toolhead.extruder %}
    {% set pa = printer[extruder].pressure_advance %}
    {% set target = printer[extruder].target %}
    {% set temp = p.temp|float %}
    RESPOND TYPE=command MSG="Forming a {material} tip at {temp|int}C (experimental)"
    SAVE_GCODE_STATE NAME=oams_form_tip
    M83
    SET_PRESSURE_ADVANCE ADVANCE=0
    M109 S{temp}
    # Ram: push the melt out at a rising rate.
    {% for step in p.ram %}
      G1 E{step[0]} F{(step[1]|float * 60)|int}
    {% endfor %}
    {% if p.style|default('classic') == 'u1' %}
      # U1 style. Positions are mm above the printing position.
      {% set up = p.pull_mm|float + p.crawl_mm|float %}
      {% set dip_mm = up - p.dip_to|float %}
      {% set dip_first = [p.dip_first_mm|float, dip_mm]|min %}
      {% set pull2 = up - p.dip_to|float - p.final_crawl_mm|float %}
      # Out of the melt zone fast, then crawl so the neck freezes and snaps.
      G1 E-{p.pull_mm} F{(p.pull_speed|float * 60)|round|int}
      G1 E-{p.crawl_mm} F{(p.crawl_speed|float * 60)|round|int}
      # Re-melt: back down to dip_to, which takes up any hair.
      G1 E{'%.2f' % dip_first} F{(p.dip_first_speed|float * 60)|round|int}
      {% if dip_mm - dip_first > 0 %}
        G1 E{'%.2f' % (dip_mm - dip_first)} F{(p.dip_rest_speed|float * 60)|round|int}
      {% endif %}
      # Out fast again, then the final, slower crawl.
      {% if pull2 > 0 %}
        G1 E-{'%.2f' % pull2} F{(p.pull2_speed|float * 60)|round|int}
      {% endif %}
      G1 E-{p.final_crawl_mm} F{(p.final_crawl_speed|float * 60)|round|int}
      # Park at park_to, where the unload's extrusion_unload_length starts.
      {% if p.park_to|float > up %}
        G1 E-{'%.2f' % (p.park_to|float - up)} F{(p.park_speed|float * 60)|round|int}
      {% endif %}
      {% if p.fan_ms|int > 0 %}
        M400
        M106 S255
        G4 P{p.fan_ms|int}
        M107
      {% endif %}
    {% else %}
      {% set cool_len = p.cool_to|float - p.cool_from|float %}
      {% set strokes = p.cool_moves|int * 2 + 1 %}
      {% set dip = p.cool_to|float - p.dip_to|float %}
      {% set snap = [p.dip_snap_mm|float, dip]|min %}
      # Separate: fast, then slow to the bottom of the cooling zone
      # (Prusa's 70/20/10 % split of the rest).
      {% set rest = p.cool_from|float - p.sep_fast_mm|float %}
      G1 E-{p.sep_fast_mm} F{(p.sep_fast_speed|float * 60)|int}
      G1 E-{'%.2f' % (rest * 0.7)} F{(p.sep_slow_speed|float * 60)|int}
      G1 E-{'%.2f' % (rest * 0.2)} F{(p.sep_slow_speed|float * 30)|int}
      G1 E-{'%.2f' % (rest * 0.1)} F{(p.sep_slow_speed|float * 18)|int}
      # Cooling strokes up and down the cooling zone, speeding up, ending up.
      {% for i in range(strokes) %}
        {% set speed = p.cool_speed_start|float + (p.cool_speed_end|float - p.cool_speed_start|float) * i / ([strokes - 1, 1]|max) %}
        G1 E{'-' if i % 2 == 0 else ''}{cool_len} F{(speed * 60)|int}
      {% endfor %}
      # Skinnydip: back to the edge of the melt zone to melt the hair, then out
      # with a snap (the buffer absorbs up to ~15 mm by itself).
      {% if dip > 0 %}
        G1 E{dip} F{(p.dip_in_speed|float * 60)|int}
        G4 P{p.dip_pause_ms|int}
        {% if snap > 0 %}
          G1 E-{snap} F{(p.dip_snap_speed|float * 60)|int}
        {% endif %}
        {% if dip - snap > 0 %}
          G1 E-{dip - snap} F{(p.dip_out_speed|float * 60)|int}
        {% endif %}
      {% endif %}
    {% endif %}
    G4 P{p.set_ms|int}
    M400
    SET_PRESSURE_ADVANCE ADVANCE={pa}
    # Hand the heater back to whatever owned it.
    M104 S{target}
    RESTORE_GCODE_STATE NAME=oams_form_tip
