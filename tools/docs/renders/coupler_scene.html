<!doctype html><html><head><meta charset="utf-8"><title>coupler render</title>
<!-- SPDX-License-Identifier: MIT -->
<style>html,body{margin:0;background:transparent;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// The PTFE tube coupler v5 with its two ECAS04 collets and a tube in each end,
// from the parts that step_parts.py split out of inputs/ptfe-coupler-v5-assembly.step.
// The tubes run along z: the "3" end (3 mm ID tube) on top, the "2" end below.
import * as THREE from "three";
import {STLLoader} from "three/addons/loaders/STLLoader.js";

const q = new URLSearchParams(location.search);
const W = +(q.get("w") || 1200), H = +(q.get("h") || 1600);
const view = (q.get("view") || "1,-0.3,0.4").split(",").map(Number);
// Tilt in degrees about the x axis, which leans the coupler across the picture.
const tilt = +(q.get("tilt") || 0);

const BODY = 0x8e8f8a, PLUNGER = 0x2f3f9e, NICKEL = 0xd1ccc0, STEEL = 0xa0a0a0, DARK = 0x3a3d40;

// Colour by STEP label; the unnamed parts (COMPOUND...) by size: the 12 mm body,
// the 4 mm OD tubes, and anything else hidden inside the body.
function look(part) {
  const [x0, y0, , x1] = part.bbox;
  const width = x1 - x0;
  if (/^Plunger/.test(part.label)) return {color: PLUNGER};
  if (/^Collet Body/.test(part.label)) return {color: NICKEL, metal: 0.7};
  if (/^Grab Ring/.test(part.label)) return {color: STEEL, metal: 0.8};
  if (/^Seal Retainer|^Rubber Seal/.test(part.label)) return {color: DARK};
  if (Math.abs(width - 12) < 0.5) return {color: BODY};
  if (Math.abs(width - 4) < 0.2) return {color: 0xf6f6f3, clear: true};
  return {color: DARK};
}

function material({color, metal = 0.02, clear = false}) {
  const m = new THREE.MeshStandardMaterial({color, roughness: clear ? 0.25 : 0.55, metalness: metal});
  if (clear) { m.transparent = true; m.opacity = 0.42; m.depthWrite = false; }
  return m;
}

const renderer = new THREE.WebGLRenderer({antialias: true, preserveDrawingBuffer: true, alpha: true});
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x000000, 0);
renderer.sortObjects = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff, 0x9aa3ab, 1.3));
const key = new THREE.DirectionalLight(0xffffff, 2.1); key.position.set(1.2, -1.6, 1.4); scene.add(key);
const rim = new THREE.DirectionalLight(0xffffff, 0.9); rim.position.set(-1.2, 0.8, 0.4); scene.add(rim);

const loader = new STLLoader();
const group = new THREE.Group();
const parts = await (await fetch("mesh/parts.json")).json();
await Promise.all(parts.map((part) => new Promise((ok, fail) => {
  loader.load(`mesh/${part.file}`, (geo) => {
    geo.computeVertexNormals();
    const l = look(part);
    const mesh = new THREE.Mesh(geo, material(l));
    if (l.clear) mesh.renderOrder = 1;
    group.add(mesh);
    ok();
  }, undefined, fail);
})));
group.rotation.x = THREE.MathUtils.degToRad(tilt);
scene.add(group);
const box = new THREE.Box3().setFromObject(group);
group.position.sub(box.getCenter(new THREE.Vector3()));
const size = box.getSize(new THREE.Vector3());
const cam = new THREE.PerspectiveCamera(18, W / H, 1, 5000);
const radius = size.length() / 2;
cam.position.copy(new THREE.Vector3(...view).normalize().multiplyScalar(radius / Math.sin(THREE.MathUtils.degToRad(9)) * 1.02));
cam.up.set(0, 0, 1);
cam.lookAt(0, 0, 0);
renderer.render(scene, cam);
window.__done = true;
</script></body></html>
