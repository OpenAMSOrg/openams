# Please refer to the documentation for the OpenAMS project at https://openams.si-forge.com/en/docs/klipper-config
# Some of the values below will have to be changed and calibrated, please refer to https://openams.si-forge.com/en/docs/startup-checks
# Please read the comments below as they contain important configuration information

# Registers the HDC1080 sensor type with Klipper's heater subsystem.
# This must be present so that 'sensor_type: HDC1080' works in your temperature sensor configs.
[hdc1080]

[mcu fps]
canbus_uuid: <your_unique_FPS_UUID>

[mcu oams_mcu1]
canbus_uuid: <your_unique_OAMS_MCU1_UUID>

# individual variables used in oams_macros.cfg. please adapt to your printer and situation
[gcode_macro _oams_macro_variables]
#filament cutter
variable_pre_cut_x:                       20  # pre-cut x-position    
variable_pre_cut_y:                      355  # pre-cut y-position
variable_post_cut_x:                      81  # post-cut x-position
variable_post_cut_y:                    355  # post-cut y_position
variable_pre_cut_speed:                 5000  # moving speed to pre-cut position
variable_cut_x:                            2  # cut x-position
variable_cut_y:                          355  # cut y-position
variable_cut_speed:                     1000  # cutting speed

# toolhead filament length parameters
# the Miro extruder (https://www.printables.com/model/1008903-the-miro-extruder) values:
variable_hotend_meltzone_compensation:     0
variable_retract_length:                   5
variable_extrusion_reload_length:         26.2         
variable_extrusion_unload_length:         32
variable_reload_speed:                  1000
# Optional faster reload: all but the last reload_slow_length mm of the
# reload at reload_fast_speed (mm/min), the rest into the melt zone at
# reload_speed. 0 keeps the whole reload at reload_speed.
variable_reload_fast_speed:                0
variable_reload_slow_length:              10
# CLEAN_NOZZLE after a load: True (the default) once the new filament has
# been reloaded down to the hot zone and passed the outlet check, so it wipes
# what the reload pushed out; False before the reload (the earlier order, and
# the one the concurrent gco-routines path can overlap with the load).
variable_clean_after_reload:           True
# unload speeds in mm/min. After the cut the extruder retracts
# extrusion_unload_length at unload_speed, then another
# extrusion_unload_additional_length at additional_unload_speed while the
# OpenAMS rewinds the spool. If a line is missing, the macros use the value
# shown here.
variable_unload_speed:                  1000
variable_extrusion_unload_additional_length: 250
variable_additional_unload_speed:       5000
# lowest hotend temperature (C) at which toolchanges and unloads may cut and
# retract. 0 (also used when the line is missing) relies on Klipper's own
# min_extrude_temp check. Raise it if min_extrude_temp is lower than your
# filament needs. A flow heats to at least this temperature.
variable_minimum_extrude_temperature:      0
# temperature (C) a toolchange or unload heats to when nothing is known
# about the filament: no temperature has been pushed for the bay, or the
# flow was given no group to take one from. 235 suits most filaments; lower
# it for a hotend that cannot hold it.
variable_unknown_material_temperature:    235
# extra ceiling (C) on what a toolchange or unload heats to, below the
# heater's own max_temp - 5. 0 (also used when the line is missing) adds no
# ceiling; set e.g. 240 on a PTFE-lined hotend.
variable_max_operation_temperature:        0

# extruder filament switches
# Enable these with the correct switch pin for your machine
# if you want to use additional filament sensors in the
# OpenAMS system macros, to verify filament was correctly
# loaded into and unload out of the toolhead
variable_fs_extruder_in:               False   # set to True if exist
variable_fs_extruder_out:              False   # set to True if exist

gcode:

# # example of filament sensor at extruder inlet
# [filament_switch_sensor extruder_in]          # uncomment if exist
#    switch_pin: ^<YOUR PIN>                # uncomment and adapt pin if exist
#    pause_on_runout: False                     # uncomment if exist

# # example of filament sensor between extruder and hotend
# [filament_switch_sensor extruder_out]         # uncomment if exist
#    switch_pin: ^<YOUR PIN>                # uncomment and adapt pin if exist
#    pause_on_runout: False                     # uncomment if exist 


[oams oams1]
mcu:oams_mcu1
# Hardware family: auto (default), ams1, ams_ht, or ams2. Auto resolves from
# firmware-published capabilities. An explicit value fixes the configured
# topology and reports a warning if firmware disagrees.
device_kind: auto

# fps: fps1     # Which FPS lane this OAMS feeds. OPTIONAL when there is only one
#               # [fps] (it defaults to that lane). REQUIRED when several named
#               # [fps <name>] lanes are defined. Every bay of a filament_group
#               # must belong to OAMS on the SAME fps lane.
# FPS slide HES value (which shoudl be 0 when offloaded and 1 when fully loaded)
# at which slide position of FPS controls function of AMS Hub Motor
# upper and lower threshold are averaged, so in this example (0.7 + 0.3)/2.0 = 0.5
# is the value the PID loop continuously adjusts the OAMS Hub Motor speed to 
# maintain filament pressure at this set point
fps_upper_threshold:          0.7  # value from which OAMS Hub Motor works on full speed 
fps_lower_threshold:          0.3  # from 0 to this value OAMS Hub Motor stops

# This value instructs if the FPS slide HES value should be reversed
# and is critical to the operation of the OpenAMS
# and the machine is on and unloaded (no filament)
# you can check the value of the FPS by checking klippy.log
# from the command line
# tail -f ~/printer_data/logs/klippy.log
# the value of the unloaded AMS / FPS should be close to 0
# if the value instead is close to 1.0, change the fps_is_reversed value to false
fps_is_reversed: true

# These are the HES values for the first stage feeders (which range from 0.0 to 1.0)
# at which filament is considered to be loaded into the spool bay
f1s_hes_on: 0.1, 0.1, 0.1, 0.1
# this here is instructing the software to take the f1s hes value and consider the
# switch OFF if it is ABOVE the f1s_hes_on value
f1s_hes_is_above: false

# These values should be calibrated and changed by using the output
# from the OAMS_CALIBRATE_HUB_HES
# These are values above which the HUB motor sensors are considered to be ON
hub_hes_on:0.85, 0.85, 0.85, 0.85
hub_hes_is_above: true

# This value instructs the firmware on WHEN to start checking the
# value of the FPS slide to stop loading filament.
# When the OAMS has fed this ptfe_length - 100mm, it will slow down the speed of the feeder and 
# check if the slide is above the fps_upper_threshold.
# If this is the case, the loading will stop, assuming the 
# the filament bottomed out at the top of the gears of the toolhead extruder.
# If you have too much friction on the PTFE tubing, sharp bends, kinks, etc, you might
# have to solve these issues to lower the friction.
# A stiffer spring is provided with the OpenAMS kit to compensate for
# longer ptfe tube lengths.
ptfe_length: 0 # this value is critical for runout auto-reload timing. A fresh
               # machine boots with 0 so you can run OAMS_CALIBRATE_PTFE_LENGTH;
               # while it is 0 a filament runout will simply pause the print
               # instead of auto-loading the next spool. Set the calibrated value
               # here. See https://openams.si-forge.com/en/docs/startup-checks

# These values change the spool rewind behavior, by adjusting the speed of the Hub motor
# so the current in the DC First stage motors matches (as closely as the PID control allows)
# the supplied value.
# Unless you have a very special situation, they should not be changed usually.
# The current target is the value from (0.0 to 1.0) to try to maintain the DC First stage 
# motor current while rewinding
current_target: 0.30
# These are the PID values for the rewind PID loop
current_kp: 3.0
current_ki: 0.0 
current_kd: 0.0

# The index of the oams, using when creating filament groups, such as oams1, or oams2
# This index is also use in the canbus logging script (scripts/canbus_logger.py) to
# print debug information and identify the AMS
# The index is also shown on the status information printed in klippy.log in order
# to distinguish between multiple AMS
oams_idx: 1

[filament_group T0]
group: oams1-0

[filament_group T1]
group: oams1-1

[filament_group T2]
group: oams1-2

[filament_group T3]
group: oams1-3

[fps]
pin: fps:PA2
# "reversed: true" inverts this reading; the unit reads the same buffer itself,
# so set it if the two are inverses (they then add up to about 1) — otherwise
# every UI draws the pressure bar backwards.
reversed: false
# Alternative for a unit that reports its own buffer reading (an AMS behind
# a Cortex Bridge): mirror that reading instead of wiring an ADC pin.
# Specify exactly one of pin/source_oams:
# source_oams: oams1
# use_kalico: false    # Accepted but ignored: the plugin auto-detects whether
#                      # it runs on mainline Klipper or Kalico from the ADC API.
# extruder: extruder   # The toolhead extruder this FPS lane feeds (default
#                      # "extruder"). The runout/auto-reload logic measures
#                      # consumption against this extruder.
#
# Multiple FPS (IDEX / multi-tool): instead of a single unnamed [fps], define a
# named lane per toolhead and point each OAMS at one with "fps:" above, e.g.
#   [fps fps1]
#   pin: fps:PA2
#   extruder: extruder
#   [fps fps2]
#   pin: fps2:PA2
#   extruder: extruder1
# A single-FPS machine needs none of this — the bare [fps] above is enough.

# --- Inline stepper follower (optional) --------------------------------------
# A [follower] is a stepper on a spare stepper port, inline with the toolhead,
# that acts as a SINGLE-BAY AMS unit: it joins filament groups (as "<name>-0"),
# loads/unloads, and serves as a runout spare. Its motion is closed-loop
# controlled by custom Klipper MCU firmware on that stepper's board (see
# FOLLOWER_PROTOCOL.md) from the FPS pressure signal plus motion-queue
# feed-forward — the printer's motion queue itself is never modified.
# Requires the follower-enabled Klipper firmware flashed on that MCU.
#
# [follower belay]
# type: stepper              # only 'stepper' today ('bldc' reserved)
# mcu: mcu                   # the MCU with the spare stepper port
# unit_idx: 9                # unique across ALL [oams] oams_idx and followers
# # fps: fps1                # required only when several [fps] lanes exist
# step_pin: PB10
# dir_pin: PB11
# enable_pin: !PB12
# rotation_distance: 22.67
# microsteps: 16
# # gear_ratio: 50:17
# pre_switch_pin: ^PA1       # filament staged at follower entry ("ready")
# post_switch_pin: ^PA2      # filament fed past the follower ("loaded")
# path_length: 0             # mm, POST switch -> extruder gears. 0 =
#                            # uncalibrated: runout pauses instead of
#                            # auto-reloading (measure and set it!)
# # Embedded TMC bring-up (omit uart_pin to run the driver standalone):
# # uart_pin: PC11
# # run_current: 0.6
# # All control tunables (fps_target/kp/ki/kd/max_speed/accel/load_speed/
# # unload_speed/...) have working defaults; see ARCHITECTURE.md.
#
# [filament_group T4]
# group: belay-0             # or mix with OAMS bays: "oams1-0, belay-0"

[temperature_sensor oams]
# This is a sensor which is currently not part of klipper's main line
# In order for the sensor to work, the klipper_openams plugin modifies the
# file ~/klipper/klippy/extras/temperature_sensors.cfg
# This causes the main line klipper repository branch on mainsail to become "dirty"
# While this is not a problem, this issue should be resolved
# once the HDC1080 temperature and humidity sensor driver is included in klipper
# main line
sensor_type: HDC1080
i2c_address: 64 # this is the address of the device as given by TI
i2c_mcu: oams_mcu1
i2c_bus:i2c0
#i2c_software_scl_pin:oams:PB6
#i2c_software_sda_pin:oams:PB7
i2c_speed:200000
temp_offset = 0.0
humidity_offset = 0.0

temp_resolution = 14 # given in bits
humidity_resolution = 14 # given in bits


# Bambu Lab master key used to derive each tag's MIFARE sector keys.
# Replace the placeholder locally; never commit a production key.
[bambu_lab_tag_processor]
key: <32_HEX_CHARACTERS>

# One driver owns both readers on the shared software-SPI bus
# (requires mainboard firmware >= 2.0.25).
[mfrc522 openams]
oams: 1
cs_pin_a: oams_mcu1:PB3
reset_pin_a: oams_mcu1:PD2
cs_pin_b: oams_mcu1:PB2
reset_pin_b: oams_mcu1:PB0
spi_software_sclk_pin: oams_mcu1:PA8
spi_software_mosi_pin: oams_mcu1:PA9
spi_software_miso_pin: oams_mcu1:PA10
spi_speed: 100000

[oams_manager]
# reload_before_toolhead_distance: 0.0  # extra margin (mm) before the runout
#                                        # auto-reload point.
# monitor_interval: 1.0                  # runout/health monitor period (s).
# toolhead_load_macro: LOAD_FILAMENT      # extruder-only capture/prime callback
# toolhead_unload_macro: UNLOAD_FILAMENT  # extruder-only retract callback; do
#                                         # not call OAMSM_* motion from either.
#                                         # It must heat and eject the filament
#                                         # PAST the extruder gears (about
#                                         # 100 mm): a 30-40 mm retract leaves
#                                         # the tip in the gears and the unit's
#                                         # rewind ends in a fault. Use the
#                                         # shipped _OAMS_TOOLHEAD_EJECT (in
#                                         # oams_macros.cfg), or your own.
# openams_config_path: ~/printer_data/config/oams.cfg
#                                        # file that runtime writeback (group
#                                        # edits AND calibration results) is
#                                        # written to (defaults to oams.cfg next
#                                        # to printer.cfg). Set this if your
#                                        # [oams]/[filament_group] sections live
#                                        # elsewhere.
#
# Diagnostics and runtime group editing (all optional, no config needed):
#   OAMSM_SELFTEST                       # read-only health report (run this first)
#   OAMSM_LOAD_TO_TOOLHEAD GROUP=<name>   # safe UI/manual load + extruder prime
#   OAMSM_UNLOAD_FROM_TOOLHEAD [FPS=<lane>]
#                                         # reverse-follow retract, then rewind
#   OAMSM_CREATE_GROUP GROUP=<name>
#   OAMSM_ASSIGN_BAY GROUP=<name> OAMS=<oamsN> BAY=<0-3>
#   OAMSM_UNASSIGN_BAY GROUP=<name> OAMS=<oamsN> BAY=<0-3>
#   OAMSM_DELETE_GROUP GROUP=<name>
# Group edits take effect immediately and are written straight to the file above
# (no SAVE_CONFIG, which can't edit an included subfile); they survive a restart.


# --- Customizing the toolchange (optional) ----------------------------------
# Put these in your OWN file (this one, or any other file printer.cfg
# includes). Never edit oams_macros.cfg: an update overwrites it. Both
# examples below are commented out, so nothing changes until you uncomment
# and adapt one.
#
# The cutter. OAMS_CUT replaces the moves CUT_FILAMENT would make; the step is
# still called "cut" on the display.
#
#[gcode_macro OAMS_CUT]
#gcode:
#    {% set v = printer["gcode_macro _oams_macro_variables"] %}
#    G90
#    G0 X{v.pre_cut_x} Y{v.pre_cut_y} F{v.pre_cut_speed}
#    G0 X{v.cut_x} Y{v.cut_y} F{v.cut_speed}
#    G0 X{v.post_cut_x} Y{v.post_cut_y} F{v.pre_cut_speed}
#    M400
#
# A hook: your own macro, run by the toolchange at a step boundary. The four
# points are _OAMS_HOOK_BEFORE_HEAT (before heating), _OAMS_HOOK_AFTER_CUT
# (after the cut, before the retract), _OAMS_HOOK_AFTER_RETRACT (a swap only)
# and _OAMS_HOOK_AFTER_FEED (after the load). A hook with variable_step has a
# step of its own on the display, at the point's place, with variable_label as
# its text; without variable_step it runs inside the step around it. Klipper
# reads a variable_ option as a literal, so the value is quoted.
#
#[gcode_macro _OAMS_HOOK_AFTER_CUT]
#variable_step: "wipe"
#variable_label: "Wiping the nozzle"
#gcode:
#    G0 X240 Y100 F3000
#
# A plan carries at most 8 steps, so a hook step that does not fit stays off
# the display and its hook still runs; the console names the step it dropped.
# CLEAN_NOZZLE is the other override point: it is your own macro, called by
# the feed step to wipe or brush the nozzle.


# Optional concurrent toolchange with gco-routines (installed alongside
# OpenAMS; see README). Installing it changes nothing. To enable it:
#   1. put [gco_routines] in printer.cfg ABOVE [include oams.cfg], before any
#      [gcode_macro] section or include that defines macros;
#   2. uncomment [include oams_macros_ordered.cfg] below. It must stay right
#      after [include oams_macros.cfg].
# Stock Klipper rejects the option that oams_macros_ordered.cfg sets, so never
# include that file without [gco_routines].
[include oams_macros.cfg]
#[include oams_macros_ordered.cfg]
