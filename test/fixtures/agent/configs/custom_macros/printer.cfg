# A printer whose owner kept a copy of an OpenAMS macro and edited another.
# stale_macros.cfg (written by the test from the shipped macro, with its
# formatting changed) is an old copy; user_macros.cfg is an edit that belongs
# in the hook points instead. The hook itself is not a finding: OpenAMS ships
# no _OAMS_HOOK_* macro, so a printer may define as many as it likes.
[include oams.cfg]
[include oams_macros.cfg]
[include stale_macros.cfg]
[include user_macros.cfg]
