# The owner copied CUT_FILAMENT out of an earlier OpenAMS and added a wipe of
# the nozzle after the cut. An update overwrites oams_macros.cfg, so the wipe
# belongs in the user's own file: OAMS_CUT replaces the cutter moves, and a
# hook with a step of its own shows the wipe on the display. Only the old
# CUT_FILAMENT copy is wrong: it still overrides the shipped macro.
[gcode_macro CUT_FILAMENT]
gcode:
    {% set v = printer["gcode_macro _oams_macro_variables"] %}
    G90
    G0 X{v.pre_cut_x} Y{v.pre_cut_y} F{v.pre_cut_speed}
    G0 X{v.cut_x} Y{v.cut_y} F{v.cut_speed}
    G0 X{v.post_cut_x} Y{v.post_cut_y} F{v.pre_cut_speed}
    M400
    WIPE_NOZZLE

[gcode_macro OAMS_CUT]
gcode:
    {% set v = printer["gcode_macro _oams_macro_variables"] %}
    G90
    G0 X{v.pre_cut_x} Y{v.pre_cut_y} F{v.pre_cut_speed}
    G0 X{v.cut_x} Y{v.cut_y} F{v.cut_speed}
    G0 X{v.post_cut_x} Y{v.post_cut_y} F{v.pre_cut_speed}
    M400

[gcode_macro _OAMS_HOOK_AFTER_CUT]
variable_step: "wipe"
variable_label: "Wiping the nozzle"
gcode:
    WIPE_NOZZLE

[gcode_macro WIPE_NOZZLE]
gcode:
    G0 X240 Y100
