# Another MMU system, an RFID reader, an uncalibrated follower and a cutter.
[include AFC/afc.cfg]
[include mmu/klipper_mmu.cfg]
[include ercf.cfg]

[hdc1080]

[mcu ok1]
canbus_uuid: 0123456789ab

[AFC]
enabled: True

[AFC_stepper my_stepper]
pin: PB1

[mmu]

[mmu_machine]

[ercf]
chain: 4

[klipper_openams]
verbose: False

[gcode_macro T7]
gcode:
    _TX GROUP=T7

[gcode_macro _oams_macro_variables]
variable_pre_cut_x: 15
variable_cut_speed: 900

[oams oams1]
mcu: ok1
oams_idx: 1
ptfe_length: 400

[follower belay]
mcu: ok1
unit_idx: 9
path_length: 0

[fps]
pin: ok1:PA2

[bambu_lab_tag_processor]
key: 0123456789abcdef0123456789abcdef

[mfrc522 openams]
oams: 1

[filament_group T4]
group: belay-1