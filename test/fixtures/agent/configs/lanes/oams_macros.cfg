# OpenAMS toolchange, unload and UI macros.
#
# Settings are read from [gcode_macro _oams_macro_variables] in oams.cfg (see
# oams_sample.cfg). Settings added after the original sample have defaults
# here, so existing oams.cfg files keep working.
#
# A toolchange (_TX, called by T0-T19 and OPENAMS_LOAD) always cuts the
# filament and finishes the OpenAMS unload first. It then takes one of two
# paths:
#
# * Serial (stock Klipper, the default): OpenAMS load, toolhead inlet check,
#   toolhead reload, outlet check and CLEAN_NOZZLE, one after another: the
#   nozzle is cleaned once the new filament is down in the hot zone, so it
#   wipes what the reload pushed out. Nothing in this path renders START, END
#   or WAIT.
# * Concurrent (optional gco-routines extension): the OpenAMS load runs in a
#   background START ... END routine, and WAIT joins it before the toolhead
#   reload. With clean_after_reload False (the earlier order) CLEAN_NOZZLE
#   runs during the load instead of after the reload. _TX uses this path only
#   when [gco_routines] is loaded, oams_macros_ordered.cfg opts _TX into
#   ordered rendering, and the printer is not paused. Otherwise _TX takes the
#   serial path.
#
# Stock Klipper renders a whole macro before running any of its commands, so
# the _OAMS_* helper macros make each decision in a fresh render that sees the
# result of the preceding step on either path.
#
# Homing and heating are steps like any other, not refusals: a flow homes
# (G28) when the axes are not homed and heats the extruder when it is colder
# than the filament needs, and both appear in the plan the displays show
# (home,heat,cut,retract[,feed]). An error is left for what the machine
# cannot do itself, which is now only a configuration the flow cannot heat
# within (a floor above the ceiling).
#
# Three helpers do this work. _OAMS_PLAN works out the flow's working
# temperature T (the filament's printing temperature: TEMP= if given, else
# the loaded or incoming bay's pushed temperature, else
# unknown_material_temperature; the higher of both for a swap), clamps it to
# max_temp - 5, max_operation_temperature and minimum_extrude_temperature,
# and announces the plan before any motion. _OAMS_HEAT then sets the heater
# and waits, just before the first filament motion. It decides again in its
# own render because a homing override (a G28 that runs a probe calibration,
# for example) can change the target after the plan was announced. A print
# that is running with its own hot target keeps it: the slicer owns that
# temperature. _OAMS_RESTORE puts the target back after a successful flow on
# an idle printer; a failed flow leaves it on, so a retry starts hot.
#
# A flow that moves no filament (same group, excluded object) announces no
# plan and heats nothing.
#
# The displays' Stop button stops the whole sequence through the openams/stop
# webhook, which G-code could not do (it would queue behind the running
# macro). The webhook flags the lane and cancels a firmware load or unload in
# flight; the macros then stop at the next boundary: OAMSM_CHECK_STOP runs
# right before every step and hook, and the heat wait is OAMSM_HEAT_WAIT, which
# stops as soon as the flag is set. Both raise "Stopped by the user", which
# fails the current step; the manager also puts back any heat the flow raised
# (never during a print). A move already queued (G1, CUT_FILAMENT, G28)
# finishes first.
#
# Four optional hook points let the printer's own macros join the flow at a
# step boundary: _OAMS_HOOK_BEFORE_HEAT (before the heat step, or where it
# would be), _OAMS_HOOK_AFTER_CUT (after cut, before retract),
# _OAMS_HOOK_AFTER_RETRACT (after retract, before feed; a swap only) and
# _OAMS_HOOK_AFTER_FEED (after feed has succeeded). A hook is a plain
# [gcode_macro _OAMS_HOOK_...] the user writes in their own file; none is
# shipped. A hook that declares variable_step (a valid step name) and
# optionally variable_label gets that step in the plan, announced by
# _OAMS_PLAN at the hook's place and entered just before the hook runs, so the
# displays show it like any other step. A hook without variable_step runs
# inside the step around it and adds no step. An error in a hook fails its
# step, like any other G-code error in a running plan. A plan carries at most
# 8 steps, so a hook step that does not fit stays out of the plan (the hook
# still runs) and a RESPOND names it.
#
# Two override points survive an update because they live in the user's own
# file: [gcode_macro OAMS_CUT] replaces the cutter moves CUT_FILAMENT would
# otherwise make (the step is still cut), and CLEAN_NOZZLE stays the nozzle
# cleaning macro the feed step calls. An OAMS_CUT that declares
# variable_label names the cut step in its own words on the displays and in
# the console (variable_label: "Form tip" on a printer that forms a tip
# instead of cutting, see oams_tip_forming.cfg).
#
# T0-T19 (through _TX) own their background routine. Call them, and
# OPENAMS_LOAD, from ordinary G-code; never place them inside another START
# block, because nested routines are not supported.
#
# With the ordered opt-in, _TX evaluates Jinja with strict undefined
# semantics: a missing variable or status field is an error instead of an
# empty value, so optional values must use |default(...). Keep each
# {% ... %} statement in _TX on its own line.
#
# These macros are lane-aware. A macro that takes GROUP resolves its lane from
# the group (oams_manager.topology.groups[GROUP].lane) and reads that lane's
# group, slot and extruder throughout; a macro without GROUP accepts FPS=,
# else uses the lane whose extruder is printer.toolhead.extruder, else the
# sole lane. The lane name is the [fps ...] section's short name ("fps" for
# the unnamed section), so a single unnamed [fps] lane behaves exactly as
# before. The resolved lane is passed down each helper chain as FPS=.
#
# On a multi-toolhead printer this assumes the tool whose lane a macro changes
# is the active one when T<n> runs (the toolchanger activates it first), so the
# toolhead sensors and cutter belong to that tool.
#
# The status read here is `oams_manager.lanes_by_fps[LANE]` (the per-FPS status
# dict; additive, outside the UI API v1 contract -- see docs/UI_API.md).

[gcode_macro CUT_FILAMENT]
# Cuts with the configured coordinates. A [gcode_macro OAMS_CUT] in the
# user's own file replaces the moves below (the step is still cut), so a
# custom cutter survives an update that rewrites this file.
gcode:
    {% set v = printer["gcode_macro _oams_macro_variables"] %}
    {% if printer.toolhead.homed_axes != 'xyz' %}
        RESPOND TYPE=command MSG='Homing'
        G28
    {% endif %}
    {% set cut_label = printer['gcode_macro OAMS_CUT'].label|default('') if 'gcode_macro OAMS_CUT' in printer else '' %}
    {% if cut_label %}
      RESPOND TYPE=command MSG="{cut_label}"
    {% else %}
      RESPOND TYPE=command MSG='Cutting'
    {% endif %}
    {% if 'gcode_macro OAMS_CUT' in printer %}
      OAMS_CUT
    {% else %}
      # The cutter coordinates are absolute. The OpenAMS macros restore the
      # previous positioning mode afterwards.
      G90
      G0 X{v.pre_cut_x} Y{v.pre_cut_y} F{v.pre_cut_speed}
      G0 X{v.cut_x} Y{v.cut_y} F{v.cut_speed}
      G0 X{v.post_cut_x} Y{v.post_cut_y} F{v.pre_cut_speed}
      M400 ; wait for all moves to end
    {% endif %}


[gcode_macro _OAMS_PLAN]
# Works out a flow's working temperature T and announces the plan, before the
# flow moves anything. KIND is load (an empty toolhead), swap (a group is
# loaded) or unload; STEPS are the plan's own steps, which home and heat come
# before.
#
# T is the filament's printing temperature: TEMP= if the user gave one, else
# the loaded bay's or the incoming bay's pushed temperature, else the higher
# of the two for a swap, else unknown_material_temperature. It is clamped to
# the heater's max_temp - 5 and to max_operation_temperature, and raised to
# minimum_extrude_temperature; a floor above that ceiling is a configuration
# error and stops the flow before any motion.
#
# T, the extruder target from before the flow and whether the flow raises it
# are remembered here, so _OAMS_HEAT heats to T and _OAMS_RESTORE puts the
# target back when the flow succeeds on an idle printer.
#
# The plan promises heat when the flow will heat now, and whenever it homes:
# homing runs after this and can change the heater (a probe calibration that
# sets its own target), so _OAMS_HEAT decides again in a fresh render. A flow
# that homes and finds the extruder hot enough skips the heat step, which the
# plan allows (C2 5.3); one that would heat always shows it.
#
# The user's own hooks take part: each _OAMS_HOOK_<point> that declares
# variable_step has that step in the plan, at the point's own place, and is
# announced with LABEL_<STEP> when it declares a variable_label. A plan
# carries at most 8 steps (C2 5.3), so a hook step that does not fit is left
# out of it; the flow still runs the hook, and the RESPOND below says which
# steps had to stay out.
variable_pre_target = 0.0
variable_raised = 0
variable_t = 0.0
# 1 when the matching hook's own step is in the announced plan, so _OAMS_HOOK
# enters it; 0 when the hook runs without a step of its own.
variable_before_heat = 0
variable_after_cut = 0
variable_after_retract = 0
variable_after_feed = 0

gcode:
    {% set v = printer["gcode_macro _oams_macro_variables"] %}
    {% set manager = printer['oams_manager'] %}
    {% set EXTRUDER = params.EXTRUDER %}
    {% set KIND = params.KIND|default('load') %}
    {% set STEPS = params.STEPS|default('feed') %}
    {% set TARGETED = params.TARGETED|default(0)|int == 1 %}
    {% set SLOT = params.SLOT|default(-1)|int %}
    {% set UNKNOWN = v.unknown_material_temperature|default(235)|float %}
    {% set MINIMUM = v.minimum_extrude_temperature|default(0)|float %}
    {% set ns = namespace(lane=params.FPS|default(none), outgoing=none, incoming=none, t=none, ceiling=0) %}
    {% if ns.lane is none and manager.lanes_by_fps|length == 1 %}{% set ns.lane = (manager.lanes_by_fps|list)[0] %}{% endif %}
    # The loaded bay's pushed temperature, for an unload and for a swap.
    {% if ns.lane is not none %}
      {% set ns.outgoing = manager.lanes_by_fps[ns.lane].filament_temp_c|default(none) %}
    {% endif %}
    # The incoming bay's: the targeted SLOT's bay, else the group's next bay.
    {% if KIND != 'unload' %}
      {% set group = namespace(entry=none) %}
      {% for entry in manager.groups|default([]) %}
        {% if entry.name == params.GROUP and (ns.lane is none or entry.lane|default(none) == ns.lane) %}{% set group.entry = entry %}{% endif %}
      {% endfor %}
      {% if TARGETED %}
        {% set target_bay = namespace(name=none, index=-1) %}
        {% for unit in manager.units|default([]) %}
          {% for slot in unit.slots|default([]) %}
            {% if slot.id|default(-1)|int == SLOT %}{% set target_bay.name = unit.name|default(none) %}{% set target_bay.index = slot.bay|default(0)|int %}{% endif %}
          {% endfor %}
        {% endfor %}
        {% if target_bay.name is not none %}
          {% set device = (manager.devices|default({})).get(target_bay.name, none) %}
          {% if device is not none and device.bays|default([])|length > target_bay.index %}
            {% set filament = device.bays[target_bay.index].filament|default(none) %}
            {% if filament is not none %}{% set ns.incoming = filament.temp_c|default(none) %}{% endif %}
          {% endif %}
        {% endif %}
      {% elif group.entry is not none %}
        {% set ns.incoming = group.entry.next_filament_temp_c|default(none) %}
      {% endif %}
    {% endif %}
    {% if 'TEMP' in params %}{% set ns.t = params.TEMP|float %}{% endif %}
    {% if ns.t is none %}
      {% set sides = namespace(outgoing=UNKNOWN, incoming=UNKNOWN) %}
      {% if ns.outgoing is not none %}{% set sides.outgoing = ns.outgoing %}{% endif %}
      {% if ns.incoming is not none %}{% set sides.incoming = ns.incoming %}{% endif %}
      {% if KIND == 'unload' %}
        {% set ns.t = sides.outgoing %}
      {% elif KIND == 'swap' %}
        {% set ns.t = [sides.outgoing, sides.incoming]|max %}
      {% else %}
        {% set ns.t = sides.incoming %}
      {% endif %}
    {% endif %}
    {% set settings = printer.configfile.settings|default({}) %}
    {% set max_temp = (settings.get(EXTRUDER|lower, none) or {}).get('max_temp', none) %}
    {% set OPERATION_CEILING = v.max_operation_temperature|default(0)|float %}
    {% set ns.ceiling = (max_temp|float) - 5 if max_temp is not none else 0 %}
    {% if OPERATION_CEILING > 0 %}{% set ns.ceiling = [ns.ceiling, OPERATION_CEILING]|min %}{% endif %}
    {% if ns.ceiling > 0 and MINIMUM > ns.ceiling %}
      { action_raise_error("OpenAMS cannot heat " ~ EXTRUDER ~ ": minimum_extrude_temperature " ~ MINIMUM ~ " is above the temperature ceiling " ~ ns.ceiling ~ ". Check minimum_extrude_temperature, max_temp and max_operation_temperature") }
    {% endif %}
    {% if ns.ceiling > 0 and ns.t > ns.ceiling %}{% set ns.t = ns.ceiling %}{% endif %}
    {% set ns.t = [ns.t, MINIMUM]|max %}
    {% set stats = printer['print_stats']|default(none) %}
    {% set PRINTING = stats is not none and stats.state|default('standby') == 'printing' %}
    {% set hot = printer[EXTRUDER] %}
    {% set TARGET = hot.target|default(0)|float %}
    {% set TEMPERATURE = hot.temperature|default(0)|float %}
    # While a print runs with its own hot target the slicer owns the
    # temperature: no heating and no heat step, whatever T says.
    {% set HOME = printer.toolhead.homed_axes != 'xyz' %}
    {% set HEAT = not (PRINTING and TARGET >= MINIMUM) and (HOME or TARGET < ns.t or TEMPERATURE < ns.t - 5) %}
    # The user's own hooks, read from their file: a step name and a label, or
    # neither (then the hook runs inside the step around it and adds no step).
    # Klipper publishes a variable_<name> option as <name>.
    {% set h = namespace(before_heat='', before_heat_label='', after_cut='', after_cut_label='', after_retract='', after_retract_label='', after_feed='', after_feed_label='') %}
    {% if 'gcode_macro _OAMS_HOOK_BEFORE_HEAT' in printer %}
      {% set h.before_heat = printer['gcode_macro _OAMS_HOOK_BEFORE_HEAT'].step|default('') %}
      {% set h.before_heat_label = printer['gcode_macro _OAMS_HOOK_BEFORE_HEAT'].label|default('') %}
    {% endif %}
    {% if 'gcode_macro _OAMS_HOOK_AFTER_CUT' in printer %}
      {% set h.after_cut = printer['gcode_macro _OAMS_HOOK_AFTER_CUT'].step|default('') %}
      {% set h.after_cut_label = printer['gcode_macro _OAMS_HOOK_AFTER_CUT'].label|default('') %}
    {% endif %}
    {% if 'gcode_macro _OAMS_HOOK_AFTER_RETRACT' in printer %}
      {% set h.after_retract = printer['gcode_macro _OAMS_HOOK_AFTER_RETRACT'].step|default('') %}
      {% set h.after_retract_label = printer['gcode_macro _OAMS_HOOK_AFTER_RETRACT'].label|default('') %}
    {% endif %}
    {% if 'gcode_macro _OAMS_HOOK_AFTER_FEED' in printer %}
      {% set h.after_feed = printer['gcode_macro _OAMS_HOOK_AFTER_FEED'].step|default('') %}
      {% set h.after_feed_label = printer['gcode_macro _OAMS_HOOK_AFTER_FEED'].label|default('') %}
    {% endif %}
    {% macro hook_step(plan, point, step, label) %}{% if step %}{% if plan.steps|length < 8 %}{% set plan.steps = plan.steps + [step] %}{% set plan.points = plan.points + [point] %}{% if label %}{% set plan.labels = plan.labels ~ ' LABEL_' ~ (step|upper) ~ '="' ~ label ~ '"' %}{% endif %}{% else %}{% set plan.dropped = plan.dropped + [step] %}{% endif %}{% endif %}{% endmacro %}
    # home, then the hook before heat, then heat, then the flow's own steps,
    # each with its own hook after the step that hook follows.
    {% set plan = namespace(steps=[], points=[], dropped=[], labels='') %}
    {% set flow = STEPS.split(',') %}
    {% if HOME %}{% set plan.steps = plan.steps + ['home'] %}{% endif %}
    {hook_step(plan, 'BEFORE_HEAT', h.before_heat, h.before_heat_label)}
    {% if HEAT %}{% set plan.steps = plan.steps + ['heat'] %}{% endif %}
    {% for step in flow %}
      {% set plan.steps = plan.steps + [step] %}
      {% if step == 'cut' %}{hook_step(plan, 'AFTER_CUT', h.after_cut, h.after_cut_label)}{% endif %}
      {% if step == 'retract' and 'feed' in flow %}{hook_step(plan, 'AFTER_RETRACT', h.after_retract, h.after_retract_label)}{% endif %}
      {% if step == 'feed' %}{hook_step(plan, 'AFTER_FEED', h.after_feed, h.after_feed_label)}{% endif %}
    {% endfor %}
    {% if plan.dropped %}
      RESPOND TYPE=command MSG="OpenAMS plan already holds 8 steps: {plan.dropped|join(', ')} run without a step of their own"
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_OAMS_PLAN VARIABLE=pre_target VALUE={TARGET}
    SET_GCODE_VARIABLE MACRO=_OAMS_PLAN VARIABLE=raised VALUE=0
    SET_GCODE_VARIABLE MACRO=_OAMS_PLAN VARIABLE=t VALUE={ns.t}
    SET_GCODE_VARIABLE MACRO=_OAMS_PLAN VARIABLE=before_heat VALUE={1 if 'BEFORE_HEAT' in plan.points else 0}
    SET_GCODE_VARIABLE MACRO=_OAMS_PLAN VARIABLE=after_cut VALUE={1 if 'AFTER_CUT' in plan.points else 0}
    SET_GCODE_VARIABLE MACRO=_OAMS_PLAN VARIABLE=after_retract VALUE={1 if 'AFTER_RETRACT' in plan.points else 0}
    SET_GCODE_VARIABLE MACRO=_OAMS_PLAN VARIABLE=after_feed VALUE={1 if 'AFTER_FEED' in plan.points else 0}
    # A cut override that names its step (OAMS_CUT variable_label) has the
    # cut step shown in its words.
    {% if 'cut' in plan.steps and 'gcode_macro OAMS_CUT' in printer %}
      {% set cut_label = printer['gcode_macro OAMS_CUT'].label|default('') %}
      {% if cut_label %}{% set plan.labels = plan.labels ~ ' LABEL_CUT="' ~ cut_label ~ '"' %}{% endif %}
    {% endif %}
    OAMSM_STAGE PLAN={plan.steps|join(',')}{plan.labels} {('FPS=' ~ ns.lane) if ns.lane is not none else ''}


[gcode_macro _OAMS_HEAT]
# Heats the extruder to the working temperature _OAMS_PLAN worked out, and
# waits for it. A flow calls this right before its first filament motion.
#
# The user's _OAMS_HOOK_BEFORE_HEAT runs first, which is the point where the
# heat step is entered (or where it would be, on a flow that needs no heat).
#
# The new target is the higher of the current one and T, so a hotter preheat
# by the user is kept. While a print runs with its own hot target the slicer
# owns the temperature: nothing is set and no heat step is entered.
gcode:
    {% set v = printer["gcode_macro _oams_macro_variables"] %}
    {% set EXTRUDER = params.EXTRUDER %}
    {% set LANE = params.FPS|default(none) %}
    {% set MINIMUM = v.minimum_extrude_temperature|default(0)|float %}
    {% set T = printer['gcode_macro _OAMS_PLAN'].t|default(0)|float %}
    _OAMS_HOOK POINT=BEFORE_HEAT {('FPS=' ~ LANE) if LANE is not none else ''}
    {% set stats = printer['print_stats']|default(none) %}
    {% set PRINTING = stats is not none and stats.state|default('standby') == 'printing' %}
    {% set hot = printer[EXTRUDER] %}
    {% set TARGET = hot.target|default(0)|float %}
    {% set TEMPERATURE = hot.temperature|default(0)|float %}
    {% set WANTED = [TARGET, T]|max %}
    {% if not (PRINTING and TARGET >= MINIMUM) and (TARGET < T or TEMPERATURE < T - 5) %}
      OAMSM_CHECK_STOP {('FPS=' ~ LANE) if LANE is not none else ''}
      OAMSM_STAGE NAME=heat DETAIL="{WANTED|int} °C" {('FPS=' ~ LANE) if LANE is not none else ''}
      {% if WANTED > TARGET %}
        SET_GCODE_VARIABLE MACRO=_OAMS_PLAN VARIABLE=raised VALUE=1
        RESPOND TYPE=command MSG='Heating {EXTRUDER} to {WANTED}'
        SET_HEATER_TEMPERATURE HEATER={EXTRUDER} TARGET={WANTED}
      {% endif %}
      # Five degrees below the target is near enough to start (the heater
      # oscillates around it), but never below the extrusion minimum.
      {% set WAIT_MINIMUM = [WANTED - 5, MINIMUM]|max %}
      {% if TEMPERATURE < WAIT_MINIMUM %}
        RESPOND TYPE=command MSG='Waiting for the extruder to reach {WAIT_MINIMUM}'
        OAMSM_HEAT_WAIT HEATER={EXTRUDER} MINIMUM={WAIT_MINIMUM} {('FPS=' ~ LANE) if LANE is not none else ''}
      {% endif %}
    {% endif %}


[gcode_macro _OAMS_RESTORE]
# Puts the extruder target back after a flow that raised it on an idle
# printer, so a heated nozzle goes cold again (0 turns it off). A failed flow
# leaves the target alone, so a retry starts hot.
gcode:
    {% set EXTRUDER = params.EXTRUDER %}
    {% set plan = printer['gcode_macro _OAMS_PLAN'] %}
    {% set stats = printer['print_stats']|default(none) %}
    {% set PRINTING = stats is not none and stats.state|default('standby') == 'printing' %}
    {% if plan.raised|default(0)|int == 1 and not PRINTING %}
      SET_HEATER_TEMPERATURE HEATER={EXTRUDER} TARGET={plan.pre_target|default(0)|float}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_OAMS_PLAN VARIABLE=raised VALUE=0


[gcode_macro _OAMS_HOOK]
# Runs one of the user's own hooks at a step boundary of the toolchange or
# unload. POINT is the hook's name without its _OAMS_HOOK_ prefix
# (BEFORE_HEAT, AFTER_CUT, AFTER_RETRACT, AFTER_FEED) and FPS= the lane, as
# the flow that calls it knows. None of these macros is shipped, so a point
# with no [gcode_macro _OAMS_HOOK_<point>] in the printer's own files does
# nothing here and the flow moves on.
#
# A hook that declares variable_step (a valid step name) and optionally
# variable_label has that step in the plan (C2 5.3), which _OAMS_PLAN
# announced at this point; the step is entered just before the hook runs, so
# the displays show it like any other step, and a G-code error in the hook
# fails it. A hook without variable_step runs inside the step around it and
# adds no step. A step the plan had to leave out is not entered, which
# _OAMS_PLAN's RESPOND has already said.
gcode:
    # A user stop takes effect before the hook (and its step) starts.
    OAMSM_CHECK_STOP {('FPS=' ~ params.FPS) if params.FPS|default('') else ''}
    {% set NAME = '_OAMS_HOOK_' ~ params.POINT %}
    {% if ('gcode_macro ' ~ NAME) in printer %}
      {% set STEP = printer['gcode_macro ' ~ NAME].step|default('') %}
      {% set FPS = params.FPS|default('') %}
      {% set IN_PLAN = printer['gcode_macro _OAMS_PLAN'][params.POINT|lower]|default(0)|int %}
      {% if STEP and IN_PLAN %}
        OAMSM_STAGE NAME={STEP} {('FPS=' ~ FPS) if FPS else ''}
      {% endif %}
      {NAME}{(' FPS=' ~ FPS) if FPS else ''}
    {% endif %}


[gcode_macro SAFE_UNLOAD_FILAMENT]

variable_pause_triggered = False

gcode:
    {% set v = printer["gcode_macro _oams_macro_variables"] %}
    {% set manager = printer['oams_manager'] %}
    {% set ns = namespace(lane=params.FPS|default(none)) %}
    {% if ns.lane is none %}{% for name in manager.lanes_by_fps %}{% if manager.lanes_by_fps[name].extruder == printer.toolhead.extruder %}{% set ns.lane = name %}{% endif %}{% endfor %}{% endif %}
    {% if ns.lane is none and manager.lanes_by_fps|length == 1 %}{% set ns.lane = (manager.lanes_by_fps|list)[0] %}{% endif %}
    {% if ns.lane is none %}
      { action_raise_error("Cannot tell which OpenAMS lane to unload; pass FPS=<name>") }
    {% endif %}
    {% set LANE = ns.lane %}
    {% set LANE_EXTRUDER = manager.lanes_by_fps[LANE].extruder %}
    {% set STRICT = params.STRICT|default(0)|int == 1 %}
    {% set STAGED = params.STAGED|default(0)|int == 1 %}
    {% set UNLOAD_SPEED = v.unload_speed|default(1000) %}
    {% if STRICT and pause_triggered %}
      { action_raise_error("Resolve the previous unload sensor failure before retrying") }
    {% endif %}
    # C2 5.3: a toolchange already announced its plan and passes STAGED=1,
    # so this macro only works out and announces its own on a standalone
    # unload. Both then home and heat as steps before they move filament.
    {% if not STAGED %}
      _OAMS_PLAN EXTRUDER={LANE_EXTRUDER} FPS={LANE} KIND=unload STEPS=cut,retract {('TEMP=' ~ params.TEMP) if 'TEMP' in params else ''}
    {% endif %}
    {% if printer.toolhead.homed_axes != 'xyz' %}
      OAMSM_CHECK_STOP FPS={LANE}
      OAMSM_STAGE NAME=home FPS={LANE}
      G28
    {% endif %}
    _OAMS_HEAT EXTRUDER={LANE_EXTRUDER} FPS={LANE}
    SAVE_GCODE_STATE NAME=oams_unload
    {% if not STRICT %}
      SET_GCODE_VARIABLE MACRO=SAFE_UNLOAD_FILAMENT VARIABLE=pause_triggered VALUE=False
    {% endif %}
    M83
    # A unit without a reverse follower (AMS_CAP_REVERSE_FOLLOWER=0) retracts
    # on its own in its unload command, so nothing is asked of it here.
    {% set RF = namespace(ok=True) %}
    {% set LUNIT = manager.lanes_by_fps[LANE].unit if LANE is not none else none %}
    {% if LUNIT is not none %}
      {% for UN, UI in manager.topology.oams.items() %}
        {% set CAPS = (manager.devices|default({})).get(UN, {}).get('capabilities', {}) %}
        {% if UI.idx == LUNIT[0] and CAPS.get('reverse_follower', true) == false %}
          {% set RF.ok = False %}
        {% endif %}
      {% endfor %}
    {% endif %}
    {% if RF.ok %}
      OAMSM_FOLLOWER ENABLE=1 DIRECTION=0 FPS={LANE}
    {% endif %}
    SET_STEPPER_ENABLE STEPPER={LANE_EXTRUDER} ENABLE=1
    OAMSM_CHECK_STOP FPS={LANE}
    OAMSM_STAGE NAME=cut FPS={LANE}
    G1 E-{v.retract_length} F{UNLOAD_SPEED}
    CUT_FILAMENT
    # PARK_MACRO ; uncomment this line if you have a park macro, and rename it to whatever your park macro is called
    M83
    G1 E-{v.extrusion_unload_length} F{UNLOAD_SPEED}
    M400
    _UNLOAD_FS_OUT STRICT={1 if STRICT else 0} FPS={LANE}
    _OAMS_FINISH_UNLOAD STRICT={1 if STRICT else 0} STARTED_PAUSED={1 if printer.pause_resume.is_paused else 0} STAGED={1 if STAGED else 0} FPS={LANE}


[gcode_macro _OAMS_FINISH_UNLOAD]
# A fresh render sees the result of the toolhead sensor check.
gcode:
    {% set v = printer["gcode_macro _oams_macro_variables"] %}
    {% set LANE = params.FPS|default(none) %}
    {% set STRICT = params.STRICT|default(0)|int %}
    {% set STAGED = params.STAGED|default(0)|int %}
    {% set STARTED_PAUSED = params.STARTED_PAUSED|default(0)|int %}
    {% set NEW_PAUSE = printer.pause_resume.is_paused and not STARTED_PAUSED %}
    {% set MSG = 'OpenAMS unload stopped because the printer was paused' if NEW_PAUSE else 'OpenAMS unload stopped after the toolhead sensor check' %}
    {% if not printer["gcode_macro SAFE_UNLOAD_FILAMENT"].pause_triggered and not NEW_PAUSE %}
      G1 E-{v.extrusion_unload_additional_length|default(250)} F{v.additional_unload_speed|default(5000)}
      # wait 1 second so the extruder is fully to speed
      G4 P1000
      # The cut is done, so the user's hook runs here: after cut, before the
      # retract step.
      _OAMS_HOOK POINT=AFTER_CUT {('FPS=' ~ LANE) if LANE is not none else ''}
      OAMSM_CHECK_STOP {('FPS=' ~ LANE) if LANE is not none else ''}
      OAMSM_STAGE NAME=retract {('FPS=' ~ LANE) if LANE is not none else ''}
      {% if STRICT == 1 %}
        OAMSM_UNLOAD_FILAMENT STRICT=1 {('FPS=' ~ LANE) if LANE is not none else ''}
      {% else %}
        OAMSM_UNLOAD_FILAMENT {('FPS=' ~ LANE) if LANE is not none else ''}
      {% endif %}
      M400
      _OAMS_CONFIRM_UNLOADED STRICT={STRICT} STARTED_PAUSED={STARTED_PAUSED} STAGED={STAGED} {('FPS=' ~ LANE) if LANE is not none else ''}
    {% else %}
      RESTORE_GCODE_STATE NAME=oams_unload
      _OAMS_ABORT STRICT={STRICT} MSG="{MSG}" {('FPS=' ~ LANE) if LANE is not none else ''}
    {% endif %}


[gcode_macro _OAMS_CONFIRM_UNLOADED]
# The driver reports some unload failures without raising. Check its state.
gcode:
    {% set manager = printer['oams_manager'] %}
    {% set LANE = params.FPS|default(none) %}
    {% set STAGED = params.STAGED|default(0)|int %}
    {% set NEW_PAUSE = printer.pause_resume.is_paused and not params.STARTED_PAUSED|default(0)|int %}
    {% set MSG = 'OpenAMS unload stopped because the printer was paused' if NEW_PAUSE else 'OpenAMS did not finish unloading. Inspect the filament path before retrying' %}
    RESTORE_GCODE_STATE NAME=oams_unload
    {% set LOADED_GROUP = manager.lanes_by_fps[LANE].group if LANE is not none else manager.current_group %}
    {% if LOADED_GROUP is not none or NEW_PAUSE %}
      _OAMS_ABORT STRICT={params.STRICT|default(0)|int} MSG="{MSG}" {('FPS=' ~ LANE) if LANE is not none else ''}
    {% elif not STAGED %}
      _OAMS_RESTORE EXTRUDER={manager.lanes_by_fps[LANE].extruder if LANE is not none else printer.toolhead.extruder}
      OAMSM_STAGE DONE=1 {('FPS=' ~ LANE) if LANE is not none else ''}
    {% endif %}


[gcode_macro _TX]

variable_pause_triggered = False

gcode:
    {% set v = printer["gcode_macro _oams_macro_variables"] %}
    {% set manager = printer['oams_manager'] %}
    {% set GROUP = params.GROUP %}
    {% set LANE = (manager.topology.groups.get(GROUP) or {}).get('lane') %}
    {% set TARGETED = 'SLOT' in params %}
    {% set SLOT = params.SLOT|default(-1)|int %}
    {% set LOADED_GROUP = manager.lanes_by_fps[LANE].group if LANE is not none else none %}
    {% set LOADED_SLOT = manager.lanes_by_fps[LANE].current_slot if TARGETED and LANE is not none else none %}
    {% set EXCLUDED = printer.exclude_object.current_object in printer.exclude_object.excluded_objects %}
    {% set SWITCH = not EXCLUDED and not (LOADED_GROUP == GROUP and (not TARGETED or LOADED_SLOT == SLOT)) %}
    {% set LOAD_ARGS = 'GROUP=' ~ GROUP ~ ((' SLOT=' ~ SLOT) if TARGETED else '') %}
    {% set HELPER_ARGS = 'GROUP=' ~ GROUP ~ ' SLOT=' ~ SLOT ~ ' STRICT=' ~ (1 if TARGETED else 0) ~ ' STARTED_PAUSED=' ~ (1 if printer.pause_resume.is_paused else 0) ~ ((' FPS=' ~ LANE) if LANE is not none else '') %}
    # The serial path needs to know whether an unload happened, so it knows
    # whether the hook between retract and feed is due.
    {% set RETRACTED_ARGS = 'RETRACTED=' ~ (1 if LOADED_GROUP is not none else 0) %}
    {% set LANE_EXTRUDER = manager.lanes_by_fps[LANE].extruder if LANE is not none else printer.toolhead.extruder %}
    # Concurrent loading needs the live extension and this macro's explicit
    # ordered opt-in. Klipper omits empty sections from configfile.settings,
    # so the extension itself is detected as a printer object.
    {% set HAS_GCO_ROUTINES = 'gco_routines' in printer and printer.configfile.settings.get('gcode_macro _tx', {}).get('render_mode', 'legacy') == 'ordered' %}
    {% if TARGETED %}
      {% if pause_triggered %}
        { action_raise_error("Resolve the previous load sensor failure before retrying") }
      {% endif %}
      # Validation executes before any homing, cutting, or unloading.
      OAMSM_VALIDATE_LOAD GROUP={GROUP} SLOT={params.SLOT}
    {% endif %}
    {% if SWITCH %}
      # Configuration section names are lowercase in configfile.settings.
      {% if not TARGETED and ('filament_group ' ~ GROUP|lower) not in printer.configfile.settings %}
        { action_raise_error("Unknown OpenAMS filament group " ~ GROUP) }
      {% endif %}
      # C2 5.3: work out the flow's working temperature and announce the plan
      # before any motion, home and heat steps included. The same-group and
      # excluded-object paths announce nothing and heat nothing: they move no
      # filament. A swap heats the unload below; a load into an empty toolhead
      # heats here, once homing is done.
      {% set PLAN_ARGS = 'EXTRUDER=' ~ LANE_EXTRUDER ~ ((' FPS=' ~ LANE) if LANE is not none else '') ~ ' GROUP=' ~ GROUP ~ ' SLOT=' ~ SLOT ~ ' TARGETED=' ~ (1 if TARGETED else 0) ~ ((' TEMP=' ~ params.TEMP) if 'TEMP' in params else '') %}
      {% if LOADED_GROUP is not none %}
        _OAMS_PLAN {PLAN_ARGS} KIND=swap STEPS=cut,retract,feed
      {% else %}
        _OAMS_PLAN {PLAN_ARGS} KIND=load STEPS=feed
      {% endif %}
    {% endif %}


    # this is a fix for orca slicer's mishandling of change overs during object exclusion
    # Orcas issued a change over of color without first ending the currently excluded object
    # we are now going to ignore change overs if we are ignoring the excluding object
    # because of this bug, the starting color on the next object after exclusionn might not be correct
    {% if printer.toolhead.homed_axes != 'xyz' %}
        RESPOND TYPE=command MSG='Homing'
        {% if SWITCH %}
          OAMSM_CHECK_STOP {('FPS=' ~ LANE) if LANE is not none else ''}
          OAMSM_STAGE NAME=home {('FPS=' ~ LANE) if LANE is not none else ''}
        {% endif %}
        G28
    {% endif %}
    # A load into an empty toolhead moves no filament before this, so the
    # heating belongs here; a swap heats in its unload.
    {% if SWITCH and LOADED_GROUP is none %}
      _OAMS_HEAT EXTRUDER={LANE_EXTRUDER} {('FPS=' ~ LANE) if LANE is not none else ''}
    {% endif %}
    {% if not EXCLUDED %}
      {% if not SWITCH %}
        RESPOND TYPE=command MSG='Toolhead already loaded with {GROUP}'
      {% else %}
        RESPOND TYPE=command MSG='Switching {LOADED_GROUP} -> {GROUP}'
        {% if not TARGETED %}
          SET_GCODE_VARIABLE MACRO=_TX VARIABLE=pause_triggered VALUE=False
        {% endif %}
        SAVE_GCODE_STATE NAME=oams_toolchange
        {% if LOADED_GROUP is not none %}
          {% if TARGETED %}
            SAFE_UNLOAD_FILAMENT STRICT=1 STAGED=1 FPS={LANE}
          {% else %}
            SAFE_UNLOAD_FILAMENT STAGED=1 FPS={LANE}
          {% endif %}
        {% endif %}
        # With the ordered opt-in this condition is evaluated after the unload.
        {% if HAS_GCO_ROUTINES and not printer.pause_resume.is_paused and not printer["gcode_macro _TX"].pause_triggered and (manager.lanes_by_fps[LANE].group if LANE is not none else manager.current_group) is none %}
          # The background routine owns only the OpenAMS transport, so the
          # toolhead can clean the nozzle meanwhile. M400 finishes the
          # cleaning motion before WAIT joins the load and the helper checks it.
          {% if LOADED_GROUP is not none %}
            _OAMS_HOOK POINT=AFTER_RETRACT {('FPS=' ~ LANE) if LANE is not none else ''}
          {% endif %}
          OAMSM_CHECK_STOP {('FPS=' ~ LANE) if LANE is not none else ''}
          OAMSM_STAGE NAME=feed {('FPS=' ~ LANE) if LANE is not none else ''}
          # Decided here: no branch may sit between START and WAIT.
          {% set CLEAN_DURING_LOAD = 'CLEAN_NOZZLE' if not v.clean_after_reload|default(True) else '' %}
          START
            OAMSM_LOAD_FILAMENT {LOAD_ARGS}
          END
          {CLEAN_DURING_LOAD}
          M400
          WAIT
          _OAMS_CONTINUE_AFTER_LOAD {HELPER_ARGS}{' CLEAN=1' if v.clean_after_reload|default(True) else ''}
        {% else %}
          _OAMS_CONTINUE_AFTER_UNLOAD {HELPER_ARGS} {RETRACTED_ARGS}
        {% endif %}
      {% endif %}
    {% endif %}


[gcode_macro _OAMS_CONTINUE_AFTER_UNLOAD]
# Serial path. A fresh render sees the completed unload before loading.
gcode:
    {% set manager = printer['oams_manager'] %}
    {% set LANE = params.FPS|default(none) %}
    {% set NEW_PAUSE = printer.pause_resume.is_paused and not params.STARTED_PAUSED|default(0)|int %}
    {% set MSG = 'OpenAMS toolchange stopped because the printer was paused' if NEW_PAUSE else 'OpenAMS toolchange stopped before loading. Inspect the filament path before retrying' %}
    {% set ARGS = 'GROUP=' ~ params.GROUP ~ ' SLOT=' ~ params.SLOT ~ ' STRICT=' ~ params.STRICT ~ ' STARTED_PAUSED=' ~ params.STARTED_PAUSED ~ ((' FPS=' ~ LANE) if LANE is not none else '') %}
    {% set LOADED_GROUP = manager.lanes_by_fps[LANE].group if LANE is not none else manager.current_group %}
    {% if printer["gcode_macro _TX"].pause_triggered or NEW_PAUSE or LOADED_GROUP is not none %}
      _OAMS_FAIL_TOOLCHANGE STRICT={params.STRICT} MSG="{MSG}" {('FPS=' ~ LANE) if LANE is not none else ''}
    {% else %}
      # An unload happened, so the retract is over and the user's hook runs
      # between the retract and feed steps (a swap only).
      {% if params.RETRACTED|default(0)|int == 1 %}
        _OAMS_HOOK POINT=AFTER_RETRACT {('FPS=' ~ LANE) if LANE is not none else ''}
      {% endif %}
      OAMSM_CHECK_STOP {('FPS=' ~ LANE) if LANE is not none else ''}
      OAMSM_STAGE NAME=feed {('FPS=' ~ LANE) if LANE is not none else ''}
      {% if params.STRICT|int == 1 %}
        OAMSM_LOAD_FILAMENT GROUP={params.GROUP} SLOT={params.SLOT}
      {% else %}
        OAMSM_LOAD_FILAMENT GROUP={params.GROUP}
      {% endif %}
      # Settle before the inlet check, as before. The concurrent path cleans
      # the nozzle during this interval instead.
      M400
      G4 P1000
      _OAMS_CONTINUE_AFTER_LOAD {ARGS} CLEAN=1
    {% endif %}


[gcode_macro _OAMS_CONTINUE_AFTER_LOAD]
# A fresh render sees the completed load on both paths. The driver reports
# some load failures without raising, so check its state.
gcode:
    {% set manager = printer['oams_manager'] %}
    {% set LANE = params.FPS|default(none) %}
    {% set STRICT = params.STRICT|default(0)|int %}
    {% set STARTED_PAUSED = params.STARTED_PAUSED|default(0)|int %}
    {% set LOADED_GROUP = manager.lanes_by_fps[LANE].group if LANE is not none else manager.current_group %}
    {% set LOADED_SLOT = manager.lanes_by_fps[LANE].current_slot if LANE is not none else none %}
    {% set NEW_PAUSE = printer.pause_resume.is_paused and not STARTED_PAUSED %}
    {% if NEW_PAUSE %}
      _OAMS_FAIL_TOOLCHANGE STRICT={STRICT} MSG="OpenAMS toolchange stopped because the printer was paused" {('FPS=' ~ LANE) if LANE is not none else ''}
    {% elif LOADED_GROUP != params.GROUP or (STRICT == 1 and LOADED_SLOT != params.SLOT|int) %}
      _OAMS_FAIL_TOOLCHANGE STRICT={STRICT} MSG="OpenAMS did not load {params.GROUP}. The toolhead was not reloaded" {('FPS=' ~ LANE) if LANE is not none else ''}
    {% else %}
      _LOAD_FS_IN STRICT={STRICT} {('FPS=' ~ LANE) if LANE is not none else ''}
      _OAMS_CONTINUE_AFTER_INLET STRICT={STRICT} STARTED_PAUSED={STARTED_PAUSED} CLEAN={params.CLEAN|default(0)|int} {('FPS=' ~ LANE) if LANE is not none else ''}
    {% endif %}


[gcode_macro _OAMS_CONTINUE_AFTER_INLET]
# A fresh render sees the result of the toolhead inlet check.
gcode:
    {% set v = printer["gcode_macro _oams_macro_variables"] %}
    {% set manager = printer['oams_manager'] %}
    {% set LANE = params.FPS|default(none) %}
    {% set LANE_EXTRUDER = manager.lanes_by_fps[LANE].extruder if LANE is not none else printer.toolhead.extruder %}
    {% set RELOAD_LENGTH = v.extrusion_reload_length + v.retract_length + v.hotend_meltzone_compensation %}
    {% set NEW_PAUSE = printer.pause_resume.is_paused and not params.STARTED_PAUSED|default(0)|int %}
    {% set MSG = 'OpenAMS toolchange stopped because the printer was paused' if NEW_PAUSE else 'OpenAMS toolchange stopped at the toolhead inlet check' %}
    {% if printer["gcode_macro _TX"].pause_triggered or NEW_PAUSE %}
      _OAMS_FAIL_TOOLCHANGE STRICT={params.STRICT} MSG="{MSG}" {('FPS=' ~ LANE) if LANE is not none else ''}
    {% else %}
      # clean_after_reload (the default) cleans the nozzle once the reload has
      # reached the hot zone; False cleans it here, before the reload.
      {% set CLEAN = params.CLEAN|default(0)|int == 1 %}
      {% set CLEAN_AFTER = v.clean_after_reload|default(True) %}
      {% if CLEAN and not CLEAN_AFTER %}
        CLEAN_NOZZLE
        M400
      {% endif %}
      SET_STEPPER_ENABLE STEPPER={LANE_EXTRUDER} ENABLE=1
      M83
      # Optional fast reload: all but the last reload_slow_length mm at
      # reload_fast_speed, then into the melt zone at reload_speed. Without
      # reload_fast_speed the whole reload runs at reload_speed.
      {% set FAST_SPEED = v.reload_fast_speed|default(0)|float %}
      {% set SLOW_LENGTH = [[v.reload_slow_length|default(0)|float, 0.0]|max, RELOAD_LENGTH]|min %}
      {% if FAST_SPEED > 0 and RELOAD_LENGTH - SLOW_LENGTH > 0 %}
        G1 E{'%.2f' % (RELOAD_LENGTH - SLOW_LENGTH)} F{FAST_SPEED|int}
        {% if SLOW_LENGTH > 0 %}
          G1 E{'%.2f' % SLOW_LENGTH} F{v.reload_speed}
        {% endif %}
      {% else %}
        G1 E{RELOAD_LENGTH} F{v.reload_speed}
      {% endif %}
      M400
      G4 P1000
      _LOAD_FS_OUT STRICT={params.STRICT} {('FPS=' ~ LANE) if LANE is not none else ''}
      _OAMS_FINISH_TOOLCHANGE STRICT={params.STRICT} STARTED_PAUSED={params.STARTED_PAUSED} CLEAN={1 if CLEAN and CLEAN_AFTER else 0} {('FPS=' ~ LANE) if LANE is not none else ''}
    {% endif %}


[gcode_macro _OAMS_FINISH_TOOLCHANGE]
# A fresh render sees the outlet check before deciding whether moving back to
# the saved position is safe.
gcode:
    {% set manager = printer['oams_manager'] %}
    {% set LANE = params.FPS|default(none) %}
    {% set NEW_PAUSE = printer.pause_resume.is_paused and not params.STARTED_PAUSED|default(0)|int %}
    {% set MSG = 'OpenAMS toolchange stopped because the printer was paused' if NEW_PAUSE else 'OpenAMS toolchange stopped at the extruder outlet check' %}
    {% if printer["gcode_macro _TX"].pause_triggered or NEW_PAUSE %}
      _OAMS_FAIL_TOOLCHANGE STRICT={params.STRICT} MSG="{MSG}" {('FPS=' ~ LANE) if LANE is not none else ''}
    {% else %}
      # The new filament is down in the hot zone and passed the outlet check:
      # clean the nozzle now (clean_after_reload), so it wipes what the
      # reload pushed out.
      {% if params.CLEAN|default(0)|int == 1 %}
        CLEAN_NOZZLE
        M400
      {% endif %}
      # The feed has succeeded (inlet check, reload and outlet check), so the
      # user's hook runs before the plan is closed.
      _OAMS_HOOK POINT=AFTER_FEED {('FPS=' ~ LANE) if LANE is not none else ''}
      _OAMS_RESTORE EXTRUDER={manager.lanes_by_fps[LANE].extruder if LANE is not none else printer.toolhead.extruder}
      OAMSM_STAGE DONE=1 {('FPS=' ~ LANE) if LANE is not none else ''}
      RESTORE_GCODE_STATE NAME=oams_toolchange MOVE=1 MOVE_SPEED=100
    {% endif %}


[gcode_macro _OAMS_FAIL_TOOLCHANGE]
# Restore modal state without moving, then stop.
gcode:
    {% set LANE = params.FPS|default(none) %}
    OAMSM_STAGE FAILED=1 {('FPS=' ~ LANE) if LANE is not none else ''}
    RESTORE_GCODE_STATE NAME=oams_toolchange
    _OAMS_ABORT STRICT={params.STRICT|default(0)} MSG="{params.MSG}" {('FPS=' ~ LANE) if LANE is not none else ''}

[gcode_macro _OAMS_ABORT]
# Stop the follower and pause untargeted (print) toolchanges, then fail the
# command so no later G-code runs. UI (STRICT) requests fail without PAUSE.
gcode:
    {% set LANE = params.FPS|default(none) %}
    OAMSM_STAGE FAILED=1 {('FPS=' ~ LANE) if LANE is not none else ''}
    OAMSM_FOLLOWER ENABLE=0 DIRECTION=0
    {% if params.STRICT|default(0)|int != 1 %}
      PAUSE
    {% endif %}
    _OAMS_RAISE MSG="{params.MSG}"


[gcode_macro _OAMS_RAISE]
# Separate so that the recovery commands above run before the error.
gcode:
    { action_raise_error(params.MSG) }


[gcode_macro OPENAMS_LOAD]
description: Load a selected OpenAMS slot through the complete safe toolchange sequence
gcode:
    {% if 'GROUP' not in params %}
      { action_raise_error("OPENAMS_LOAD requires GROUP") }
    {% elif 'SLOT' not in params %}
      { action_raise_error("OPENAMS_LOAD requires SLOT") }
    {% else %}
      _TX GROUP={params.GROUP} SLOT={params.SLOT} {('TEMP=' ~ params.TEMP) if 'TEMP' in params else ''}
    {% endif %}

[gcode_macro OPENAMS_UNLOAD]
description: Unload OpenAMS through the complete cutter and extruder sequence
gcode:
    {% set manager = printer['oams_manager'] %}
    {% set ns = namespace(lane=params.FPS|default(none)) %}
    {% if ns.lane is none %}{% for name in manager.lanes_by_fps %}{% if manager.lanes_by_fps[name].extruder == printer.toolhead.extruder %}{% set ns.lane = name %}{% endif %}{% endfor %}{% endif %}
    {% if ns.lane is none and manager.lanes_by_fps|length == 1 %}{% set ns.lane = (manager.lanes_by_fps|list)[0] %}{% endif %}
    {% if ns.lane is none %}
      { action_raise_error("Cannot tell which OpenAMS lane to unload; pass FPS=<name>") }
    {% endif %}
    {% set LANE = ns.lane %}
    {% if manager.lanes_by_fps[LANE].current_slot is not none %}
      SAFE_UNLOAD_FILAMENT STRICT=1 FPS={LANE} {('TEMP=' ~ params.TEMP) if 'TEMP' in params else ''}
    {% else %}
      RESPOND TYPE=command MSG='OpenAMS is already unloaded'
    {% endif %}

# The sensor checks below record a failure for the helper that follows them.
# That helper pauses the print and stops the toolchange. With STRICT=1 (UI
# requests) they raise immediately instead.
[gcode_macro _LOAD_FS_IN]
gcode:
    {% set fs_extruder_in = printer["gcode_macro _oams_macro_variables"].fs_extruder_in %}
    {% set LANE = params.FPS|default(none) %}

    {% if fs_extruder_in and not printer['filament_switch_sensor extruder_in'].filament_detected %}
       {% if params.STRICT|default(0)|int == 1 %}
         OAMSM_STAGE FAILED=1 {('FPS=' ~ LANE) if LANE is not none else ''}
         { action_raise_error("Filament not detected at toolhead extruder inlet") }
       {% endif %}
       RESPOND TYPE=error MSG='Filament not detected at toolhead extruder inlet... pausing for user intervention'
       SET_GCODE_VARIABLE MACRO=_TX VARIABLE=pause_triggered VALUE=True
    {% elif fs_extruder_in and printer['filament_switch_sensor extruder_in'].filament_detected %}
        RESPOND TYPE=command MSG='Filament detected at toolhead extruder inlet... continue loading'
    {% endif %}

[gcode_macro _LOAD_FS_OUT]
gcode:
    {% set fs_extruder_out = printer["gcode_macro _oams_macro_variables"].fs_extruder_out %}
    {% set LANE = params.FPS|default(none) %}

    {% if fs_extruder_out and not printer['filament_switch_sensor extruder_out'].filament_detected %}
        {% if params.STRICT|default(0)|int == 1 %}
          OAMSM_STAGE FAILED=1 {('FPS=' ~ LANE) if LANE is not none else ''}
          { action_raise_error("Filament not detected between extruder and hotend") }
        {% endif %}
        RESPOND TYPE=error MSG='Filament not detected between toolhead extruder and hotend... pausing for user intervention'
        SET_GCODE_VARIABLE MACRO=_TX VARIABLE=pause_triggered VALUE=True
    {% elif fs_extruder_out and printer['filament_switch_sensor extruder_out'].filament_detected %}
        RESPOND TYPE=command MSG='Filament successfully loaded through extruder... continue'
    {% endif %}

[gcode_macro _UNLOAD_FS_OUT]
gcode:
    {% set fs_extruder_out = printer["gcode_macro _oams_macro_variables"].fs_extruder_out %}
    {% set LANE = params.FPS|default(none) %}

    {% if fs_extruder_out and printer['filament_switch_sensor extruder_out'].filament_detected %}
        {% if params.STRICT|default(0)|int == 1 %}
          OAMSM_STAGE FAILED=1 {('FPS=' ~ LANE) if LANE is not none else ''}
          { action_raise_error("Filament still detected between extruder and hotend after cutting") }
        {% endif %}
        RESPOND TYPE=error MSG='Filament detected between extruder and hotend!  This is most likely a failure to cut the filament, or the settings are incorrect and the extrusion_unload_length is insufficient to retract the remaining filament past the gears of the extruder   ... pausing for user intervention'
        SET_GCODE_VARIABLE MACRO=SAFE_UNLOAD_FILAMENT VARIABLE=pause_triggered VALUE=True
    {% elif fs_extruder_out and  not printer['filament_switch_sensor extruder_out'].filament_detected %}
        RESPOND TYPE=command MSG='Filament retracted past extruder... continue'
    {% endif %}

[gcode_macro _OAMS_TOOLHEAD_EJECT]
# A ready-made [oams_manager] toolhead_unload_macro:
#
#   [oams_manager]
#   toolhead_unload_macro: _OAMS_TOOLHEAD_EJECT
#
# OAMSM_UNLOAD_FROM_TOOLHEAD runs this macro while the unit's reverse follower
# is armed, then the unit rewinds the filament. The unit can only pull back
# what is already clear of the extruder gears, so the macro has to eject the
# filament past them first. A typical UNLOAD_FILAMENT retracts 30 to 40 mm,
# which leaves the tip in the gears and ends the unload in a unit fault.
#
# Heats to the loaded lane's working temperature (filament_temp_c, from the
# lane whose extruder is the active one) when the nozzle is more than 5 C
# below it, softens the tip with a short extrude, then retracts EJECT mm in
# SEGMENT mm moves (max_extrude_only_distance limits a single move). The
# nozzle is left at the temperature it was heated to. Parameters override the
# variables below for one call: EJECT, SEGMENT, SPEED.
variable_eject_distance: 100.0
variable_segment_distance: 25.0
variable_speed: 1200.0
variable_soften_distance: 10.0
variable_soften_speed: 300.0
gcode:
    {% set me = printer["gcode_macro _OAMS_TOOLHEAD_EJECT"] %}
    {% set EJECT = params.EJECT|default(me.eject_distance)|float %}
    {% set SEGMENT = [params.SEGMENT|default(me.segment_distance)|float, 1.0]|max %}
    {% set SPEED = params.SPEED|default(me.speed)|float %}
    {% set extruder = printer.toolhead.extruder %}
    {% set ns = namespace(temp=none) %}
    {% for fps, lane in printer.oams_manager.lanes_by_fps.items() %}
      {% if lane.extruder == extruder and lane.filament_temp_c is not none and ns.temp is none %}
        {% set ns.temp = lane.filament_temp_c|float %}
      {% endif %}
    {% endfor %}
    {% if ns.temp is not none and ns.temp > 0 and printer[extruder].temperature < ns.temp - 5 %}
      RESPOND TYPE=command MSG='Heating {extruder} to {ns.temp|int} for the toolhead unload'
      M109 S{ns.temp}
    {% endif %}
    M83
    {% if me.soften_distance > 0 %}
      G1 E{me.soften_distance} F{me.soften_speed}
    {% endif %}
    {% set left = namespace(mm=EJECT) %}
    {% for i in range(((EJECT / SEGMENT)|round(0, 'ceil'))|int) %}
      {% set step = [SEGMENT, left.mm]|min %}
      G1 E-{step} F{SPEED}
      {% set left.mm = left.mm - step %}
    {% endfor %}
    M82
    M400


# Usage: OAMS_TORTURE_TEST LOOPS=10
# This macro will load and unload each spool the parameter SPOOL number times
[gcode_macro OAMS_TORTURE_TEST]
gcode:
  {% set num = params.LOOPS|int %}
  {% for i in range(num) %}
       {% for j in range(4) %}
            OAMS_LOAD_SPOOL OAMS=1 SPOOL={j}
            OAMS_UNLOAD_SPOOL OAMS=1
       {% endfor %}
       RESPOND TYPE=command MSG='Number of loops now {i+1}'
  {% endfor %}


# Usage: OAMS_TOOLCHANGE_TORTURE_TEST LOOPS=10
# This macro will load and unload each spool the parameter SPOOL number times
# going through the entire routine of a tool change, including purging the filament
# This is used to ascertain the reliability of the tool change macros
# and toolhead extruder loading and unloading routines
[gcode_macro OAMS_TOOLCHANGE_TORTURE_TEST]
variable_extrusion_amount = 30
variable_extrusion_speed = 300
variable_extrusion_z_height = 100
gcode:
  {% set num = params.LOOPS|int %}
  G0 Z{extrusion_z_height} F30
  {% for i in range(num) %}
       {% for j in range(4) %}
            T{j}
            RESPOND TYPE=command MSG='Purging {extrusion_amount}mm of filament'
       {% endfor %}
       RESPOND TYPE=command MSG='Number of loops now {i+1}'
  {% endfor %}

  
  # The following macros are just placeholders necessary to
# configure up to 16 different toolchanger commands
# if you are using more than 4 ams, you will need to add another
# 4 toolchanges for each additional OAMS

# T0-T19 are traditional g-code names, so Klipper parses their arguments with
# its loose splitter and a macro's params come back mangled (TEMP=260 reads as
# "=260"). rawparams is the untouched argument list, which is what a T<n>
# caller means by TEMP=<°C>, so it is passed down as it arrived.
[gcode_macro T0]
gcode:
  _TX GROUP=T0 {rawparams}

[gcode_macro T1]
gcode:
  _TX GROUP=T1 {rawparams}

[gcode_macro T2]
gcode:
  _TX GROUP=T2 {rawparams}

[gcode_macro T3]
gcode:
  _TX GROUP=T3 {rawparams}

