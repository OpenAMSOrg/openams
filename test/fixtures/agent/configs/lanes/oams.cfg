# Two fps lanes: every unit must name its lane, and a filament group may not
# mix lanes.
[hdc1080]

[mcu ok1]
canbus_uuid: 0123456789ab

[fps fps1]
pin: ok1:PA2

[fps fps2]
pin: ok1:PB2

[oams oams1]
mcu: ok1
oams_idx: 1
fps: fps1
ptfe_length: 500
fps_is_reversed: false

[oams oams2]
mcu: ok1
oams_idx: 2
fps: fps2
ptfe_length: 500
fps_is_reversed: false

[oams ht1]
mcu: bridge_ht1
oams_idx: 3
device_kind: ams_ht
fps: fps1
ptfe_length: 500

[oams free1]

[filament_group T0]
group: oams1-0, oams2-1

[filament_group T1]
group: ht1-1

[filament_group T2]
group: oams1-2, ht1-0

# An AMS HT behind a Cortex Bridge (its per-AMS port).
[mcu bridge_ht1]
serial: /dev/oams/0a1b2c3d4e5f
restart_method: command
