# OpenAMS entries for the printer's LCD menu (Klipper's [menu] sections).
#
# install.sh links this file into the config directory, like oams_macros.cfg,
# so an update refreshes it: do not edit it. It adds "OpenAMS" near the top of
# the main menu (index 3: after SD Card on stock Klipper, after Pause print,
# Resume print and Cancel print on OpenAMSOrg/klipper-optional-improvements),
# and a "Stop OpenAMS" row at the very top while a sequence runs. Hide a list
# (or the whole entry) from your own file, included after this one, with
#   [menu __main __openams __dryer]
#   type: disabled
# The page that lists every entry is docs/guide/lcd-menu.md.
#
# Where OpenAMS runs, the host also takes the stock entries that move the
# extruder by a raw distance out of the menu at startup (the Filament list
# and Move E), unless your own config defines them or adds entries under
# them. That is done in the host, not here, because Klipper merges two
# [menu] sections of one name and a merge with your own entry could keep
# Klipper from starting.
#
# Include it only on a printer with a [display] section: Klipper reads [menu]
# sections only through its primary display, and refuses to start when they
# are left unread. install.sh adds the include only where [display] exists.
#
# It also includes oams_screen.cfg, OpenAMS's "AMS status" screen for a
# 128x64 display (generated; install.sh links it beside this file). OpenAMS >
# AMS status shows it and Printer status goes back to Klipper's own screen.
# The include has a wildcard so a checkout updated without running
# install.sh again still starts: the entries then stay hidden.
#
# How it works on the display:
# * A plain entry runs when you click it.
# * An entry that needs a target (a tool, a spool, a lane or a unit) is a
#   picker: click it, turn the knob to the target, which shows with a "?",
#   and click again to run. Turned back to its own name, the second click
#   runs nothing. A target that cannot run now shows why instead of the "?"
#   ("T4 busy", "ams2 3 empty"), and clicking it runs nothing. Only a short
#   click runs: Klipper keeps an input open after a long press, so a long
#   press that ran would run again on the click that closes it.
# * Spools are named by their unit and their place in it, counted from 1, as
#   the console does ("ams2 3" is ams2 Spool 3). Tools are the filament
#   groups, in oams.cfg order.
# * Every target comes from the live topology, so the menu fits any number of
#   units of any family. An entry that cannot run at all is hidden: Load and
#   the other motion entries while a print is printing, Unload when nothing is
#   loaded, Dryer on a printer with no dryer.
# * Everything that moves filament or heats goes through the same commands the
#   screens use (OAMSM_TOOLCHANGE, OPENAMS_LOAD, OPENAMS_UNLOAD and the other
#   guarded OpenAMS commands), never a raw firmware command.
# * Stop works while a sequence runs. A G-code command would wait behind the
#   running macro, so opening a Stop entry is itself the stop: the host
#   handles that menu event the way it handles the screens' Stop button.
# * A setting is one click: its name shows its state, and a click switches it.
#
# Klipper strips everything after a hash on every line, comments in templates
# included, so the templates below contain none.

# The Start dryer presets, per unit type: [name, C, hours, C while a print
# runs (None: not during a print)]. A unit takes dryer_presets_<its name>
# when you define one, else dryer_presets_<its family>; a unit with neither
# (an AMS 1 has no dryer) offers none, and Custom stays for anything else.
# Override one list from your own file:
#   [gcode_macro _OAMS_MENU]
#   variable_dryer_presets_ams_ht: [["PLA", 50, 8, 45], ["PA", 85, 12, None]]
#
# The values are Bambu Lab's own AMS drying presets:
# - Appendix I of https://wiki.bambulab.com/en/filament-acc/filament/dry-filament
# - Bambu Studio's own profiles (as of November 2026): the
#   filament_dev_ams_drying_* fields of resources/profiles/BBL/filament/*.json,
#   read in src/slic3r/GUI/DeviceCore/DevUtilBackend.cpp and AMSDryControl.cpp.
# Limits: AMS 2 Pro 45 to 65 C, AMS HT 45 to 85 C, 1 to 72 h.
# Names fit the display: ABS is ABS/ASA, PA is PA/PAHT-CF, PETCF is PET-CF,
# PLA-S is Support for PLA.
#
# The AMS 2 Pro rows ABS, PC, PETCF, PA and PVA go beyond Bambu's list: Bambu
# calls them not compatible with the AMS 2 Pro. OpenAMS offers them at 65 C,
# the unit's maximum, for twice the AMS HT time, which may still not dry
# them fully. PPS-CF and PPA-CF are offered on neither unit.
[gcode_macro _OAMS_MENU]
description: Settings the OpenAMS LCD menu keeps (the dryer presets, and the custom temperature and time)
variable_dryer_presets_ams2: [
    ["PLA", 45, 12, 45], ["PETG", 65, 12, 55], ["TPU", 65, 12, 45],
    ["ABS", 65, 16, 65], ["PC", 65, 16, 65], ["PETCF", 65, 24, 65],
    ["PA", 65, 24, 65], ["PVA", 65, 36, 65], ["PLA-S", 60, 12, 50]]
variable_dryer_presets_ams_ht: [
    ["PLA", 45, 12, 45], ["PETG", 65, 12, 55], ["TPU", 75, 18, 45],
    ["ABS", 80, 8, 75], ["PC", 80, 8, 80], ["PETCF", 80, 12, None],
    ["PA", 85, 12, None], ["PVA", 85, 18, 70], ["PLA-S", 60, 12, 50]]
variable_dryer_temp: 55
variable_dryer_hours: 4
# Which screen the display shows: 1 the AMS status screen, 0 Klipper's own,
# -1 not chosen since Klipper started ([display] display_group decides).
# Klipper does not publish its current display group, so the entries below
# keep it here.
variable_screen: -1
gcode:
    {action_respond_info("OpenAMS menu: custom dryer %d C for %d h" % (dryer_temp, dryer_hours))}

# index 3 counts the main menu's entries before this file. Stock Klipper:
# Tune, OctoPrint, SD Card, then OpenAMS. OpenAMSOrg/klipper-optional-
# improvements: Pause print, Resume print, Cancel print, then OpenAMS, so it
# never lands between the print rows.
[menu __main __openams]
type: list
index: 3
enable: {'oams_manager' in printer}
name: OpenAMS

### Stop ###

[menu __main __openams __stop]
type: list
name: Stop

[menu __main __openams __stop __sent]
type: command
name: Stop sent
gcode: {menu.back()}

# The same Stop at the top of the main menu, shown while a sequence runs:
# open the menu, turn once, click. It must come after [menu __main __openams]
# in this file: index 0 then shifts OpenAMS down with everything else, where
# defined first it would push OpenAMS above Cancel print.
[menu __main __oams_stop]
type: list
index: 0
enable:
    {%- set n = namespace(v=false) -%}
    {%- if 'oams_manager' in printer -%}
    {%- for st in printer.oams_manager.lanes_by_fps.values() if st.op in ['LOADING', 'UNLOADING'] or (st.stage is not none and st.stage.failed is none) -%}{%- set n.v = true -%}{%- endfor -%}
    {%- endif -%}
    {n.v}
name: Stop OpenAMS

[menu __main __oams_stop __sent]
type: command
name: Stop sent
gcode: {menu.back()}

### AMS status screen ###

[include oams_screen*.cfg]

# Shown on a 128x64 display (the screen's 16x16 glyphs need one) where
# oams_screen.cfg is loaded and the host publishes openams_screen; the
# entry for the screen that is not showing.
[menu __main __openams __screen]
type: command
enable:
    {%- set d = printer.configfile.settings.display|default({}) -%}
    {%- set m = printer['gcode_macro _OAMS_MENU'] -%}
    {%- set shown = m.screen == 1 or (m.screen < 0 and d.display_group|default('') == 'oams_tiles') -%}
    {'openams_screen' in printer and d.lcd_type|default('') in ['uc1701', 'st7920', 'emulated_st7920', 'ssd1306', 'sh1106'] and 'display_data oams_tiles head' in printer.configfile.config and not shown}
name: AMS status
gcode:
    SET_DISPLAY_GROUP GROUP=oams_tiles
    SET_GCODE_VARIABLE MACRO=_OAMS_MENU VARIABLE=screen VALUE=1
    {menu.exit()}

[menu __main __openams __printer_screen]
type: command
enable:
    {%- set d = printer.configfile.settings.display|default({}) -%}
    {%- set m = printer['gcode_macro _OAMS_MENU'] -%}
    {m.screen == 1 or (m.screen < 0 and d.display_group|default('') == 'oams_tiles')}
name: Printer status
gcode:
    {%- set d = printer.configfile.settings.display|default({}) -%}
    {%- set group = d.display_group|default('_default_16x4') -%}
    SET_DISPLAY_GROUP GROUP={'_default_16x4' if group == 'oams_tiles' else group}
    SET_GCODE_VARIABLE MACRO=_OAMS_MENU VARIABLE=screen VALUE=0
    {menu.exit()}

# Which unit the AMS status screen shows: auto (the host's rules) or one
# unit, through OAMSM_SCREEN. A picker: turn to the choice, click to set.
[menu __main __openams __screen_unit]
type: input
enable:
    {%- set d = printer.configfile.settings.display|default({}) -%}
    {'openams_screen' in printer and printer.openams_screen.units|length > 1 and d.lcd_type|default('') in ['uc1701', 'st7920', 'emulated_st7920', 'ssd1306', 'sh1106'] and 'display_data oams_tiles head' in printer.configfile.config}
name:
    {%- set scr = printer.openams_screen -%}
    {%- set k = menu.input|int -%}
    {%- if k < 0 or k > scr.units|length -%}
    { 'Screen: ' ~ (scr.pin or 'auto') }
    {%- else -%}
    { 'Show ' ~ ('auto' if k == 0 else scr.units[k - 1]) ~ '?' }
    {%- endif -%}
input: -1
input_min: -1
input_max: {printer.openams_screen.units|length}
input_step: 1
gcode:
    {%- if menu.event == 'click' -%}
    {%- set scr = printer.openams_screen -%}
    {%- set k = menu.input|int -%}
    {%- if k >= 0 and k <= scr.units|length -%}
    OAMSM_SCREEN UNIT={'AUTO' if k == 0 else scr.units[k - 1]}
    {%- endif -%}
    {%- endif -%}

### Load ###

[menu __main __openams __load]
type: list
enable: {not ('print_stats' in printer and printer.print_stats.state == 'printing') and printer.oams_manager.topology.groups|length > 0}
name: Load

[menu __main __openams __load __tool]
type: input
name:
    {%- set m = printer.oams_manager -%}
    {%- set names = m.topology.groups|list -%}
    {%- set k = menu.input|int -%}
    {%- if k < 0 or k >= names|length -%}
    Load tool
    {%- else -%}
    {%- set g = names[k] -%}
    {%- set ln = m.topology.groups[g].lane -%}
    {%- set lane = m.lanes_by_fps[ln] if ln else none -%}
    {%- set nb = namespace(v=none) -%}
    {%- for e in m.groups if e.name == g -%}{%- set nb.v = e.next_bay -%}{%- endfor -%}
    {%- set why = 'not ready' if not m.ready
        else 'no bays' if lane is none
        else 'loaded' if lane.op == 'LOADED' and lane.group == g
        else 'busy' if not lane.motion_settled
        else 'no spool' if nb.v is none
        else '' -%}
    { ('Load ' ~ g ~ '?') if not why else (g ~ ' ' ~ why) }
    {%- endif -%}
input: -1
input_min: -1
input_max: {(printer.oams_manager.topology.groups|length) - 1}
input_step: 1
gcode:
    {%- if menu.event == 'click' -%}
    {%- set m = printer.oams_manager -%}
    {%- set names = m.topology.groups|list -%}
    {%- set k = menu.input|int -%}
    {%- if k >= 0 and k < names|length -%}
    {%- set g = names[k] -%}
    {%- set ln = m.topology.groups[g].lane -%}
    {%- set lane = m.lanes_by_fps[ln] if ln else none -%}
    {%- set nb = namespace(v=none) -%}
    {%- for e in m.groups if e.name == g -%}{%- set nb.v = e.next_bay -%}{%- endfor -%}
    {%- set why = 'not ready' if not m.ready
        else 'no bays' if lane is none
        else 'loaded' if lane.op == 'LOADED' and lane.group == g
        else 'busy' if not lane.motion_settled
        else 'no spool' if nb.v is none
        else '' -%}
    {%- if not why -%}
    OAMSM_TOOLCHANGE GROUP={g}
    {%- else -%}
    {action_respond_info('OpenAMS menu: ' ~ g ~ ' ' ~ why)}
    {%- endif -%}
    {%- endif -%}
    {%- endif -%}

[menu __main __openams __load __spool]
type: input
name:
    {%- set m = printer.oams_manager -%}
    {%- set k = menu.input|int -%}
    {%- set s = namespace(u=none, b=0) -%}
    {%- for u in m.units -%}{%- for slot in u.slots if slot.id == k -%}{%- set s.u = u -%}{%- set s.b = slot.bay -%}{%- endfor -%}{%- endfor -%}
    {%- if s.u is none -%}
    Load spool
    {%- else -%}
    {%- set dev = m.devices[s.u.name] -%}
    {%- set bays = dev.bays|default([]) -%}
    {%- set bay = bays[s.b] if s.b < bays|length else none -%}
    {%- set lane = m.lanes_by_fps[s.u.lane] -%}
    {%- set at = s.u.name[:6] ~ ' ' ~ (s.b + 1) -%}
    {%- set key = s.u.name ~ '-' ~ s.b -%}
    {%- set g = namespace(v=none) -%}
    {%- for name in m.topology.groups if key in m.topology.groups[name].bays -%}{%- set g.v = name -%}{%- endfor -%}
    {%- set why = 'not ready' if not m.ready
        else 'n/a' if bay is none or 'load' not in dev.supported_actions|default(['load'])
        else 'empty' if not bay.ready
        else 'loaded' if lane.current_slot == k
        else 'no tool' if g.v is none
        else 'uncal' if bay.calibration_state|default('configured') != 'configured'
        else 'moving' if bay.positioning|default(false)
        else 'busy' if not lane.motion_settled
        else '' -%}
    { ('Load ' ~ at ~ '?') if not why else (at ~ ' ' ~ why) }
    {%- endif -%}
input: -1
input_min: -1
input_max:
    {%- set n = namespace(v=0) -%}
    {%- for u in printer.oams_manager.units -%}{%- set n.v = n.v + u.slots|length -%}{%- endfor -%}
    {n.v - 1}
input_step: 1
gcode:
    {%- if menu.event == 'click' -%}
    {%- set m = printer.oams_manager -%}
    {%- set k = menu.input|int -%}
    {%- set s = namespace(u=none, b=0) -%}
    {%- for u in m.units -%}{%- for slot in u.slots if slot.id == k -%}{%- set s.u = u -%}{%- set s.b = slot.bay -%}{%- endfor -%}{%- endfor -%}
    {%- if s.u is not none -%}
    {%- set dev = m.devices[s.u.name] -%}
    {%- set bays = dev.bays|default([]) -%}
    {%- set bay = bays[s.b] if s.b < bays|length else none -%}
    {%- set lane = m.lanes_by_fps[s.u.lane] -%}
    {%- set at = s.u.name[:6] ~ ' ' ~ (s.b + 1) -%}
    {%- set key = s.u.name ~ '-' ~ s.b -%}
    {%- set g = namespace(v=none) -%}
    {%- for name in m.topology.groups if key in m.topology.groups[name].bays -%}{%- set g.v = name -%}{%- endfor -%}
    {%- set why = 'not ready' if not m.ready
        else 'n/a' if bay is none or 'load' not in dev.supported_actions|default(['load'])
        else 'empty' if not bay.ready
        else 'loaded' if lane.current_slot == k
        else 'no tool' if g.v is none
        else 'uncal' if bay.calibration_state|default('configured') != 'configured'
        else 'moving' if bay.positioning|default(false)
        else 'busy' if not lane.motion_settled
        else '' -%}
    {%- if not why -%}
    OPENAMS_LOAD GROUP={g.v} SLOT={k}
    {%- else -%}
    {action_respond_info('OpenAMS menu: ' ~ at ~ ' ' ~ why)}
    {%- endif -%}
    {%- endif -%}
    {%- endif -%}

[menu __main __openams __load __nocut]
type: input
name:
    {%- set m = printer.oams_manager -%}
    {%- set names = m.topology.groups|list -%}
    {%- set k = menu.input|int -%}
    {%- if k < 0 or k >= names|length -%}
    Load, no cut
    {%- else -%}
    {%- set g = names[k] -%}
    {%- set ln = m.topology.groups[g].lane -%}
    {%- set lane = m.lanes_by_fps[ln] if ln else none -%}
    {%- set nb = namespace(v=none) -%}
    {%- for e in m.groups if e.name == g -%}{%- set nb.v = e.next_bay -%}{%- endfor -%}
    {%- set why = 'not ready' if not m.ready
        else 'no bays' if lane is none
        else 'loaded' if lane.op == 'LOADED' and lane.group == g
        else 'unload 1st' if lane.op != 'UNLOADED'
        else 'busy' if not lane.motion_settled
        else 'no spool' if nb.v is none
        else '' -%}
    { (g ~ ', no cut?') if not why else (g ~ ' ' ~ why) }
    {%- endif -%}
input: -1
input_min: -1
input_max: {(printer.oams_manager.topology.groups|length) - 1}
input_step: 1
gcode:
    {%- if menu.event == 'click' -%}
    {%- set m = printer.oams_manager -%}
    {%- set names = m.topology.groups|list -%}
    {%- set k = menu.input|int -%}
    {%- if k >= 0 and k < names|length -%}
    {%- set g = names[k] -%}
    {%- set ln = m.topology.groups[g].lane -%}
    {%- set lane = m.lanes_by_fps[ln] if ln else none -%}
    {%- set nb = namespace(v=none) -%}
    {%- for e in m.groups if e.name == g -%}{%- set nb.v = e.next_bay -%}{%- endfor -%}
    {%- set why = 'not ready' if not m.ready
        else 'no bays' if lane is none
        else 'loaded' if lane.op == 'LOADED' and lane.group == g
        else 'unload 1st' if lane.op != 'UNLOADED'
        else 'busy' if not lane.motion_settled
        else 'no spool' if nb.v is none
        else '' -%}
    {%- if not why -%}
    OAMSM_LOAD_TO_TOOLHEAD GROUP={g}
    {%- else -%}
    {action_respond_info('OpenAMS menu: ' ~ g ~ ' ' ~ why)}
    {%- endif -%}
    {%- endif -%}
    {%- endif -%}

### Unload ###

[menu __main __openams __unload]
type: list
enable:
    {%- set n = namespace(v=false) -%}
    {%- for st in printer.oams_manager.lanes_by_fps.values() if st.current_slot is not none -%}{%- set n.v = true -%}{%- endfor -%}
    { n.v and not ('print_stats' in printer and printer.print_stats.state == 'printing') }
name: Unload

[menu __main __openams __unload __unload]
type: input
name:
    {%- set m = printer.oams_manager -%}
    {%- set lanes = m.topology.fps -%}
    {%- set k = menu.input|int -%}
    {%- if k < 0 or k >= lanes|length -%}
    Unload
    {%- else -%}
    {%- set l = lanes[k] -%}
    {%- set st = m.lanes_by_fps[l] -%}
    {%- set what = st.group if st.group else l -%}
    {%- set why = 'not ready' if not m.ready
        else 'empty' if st.current_slot is none
        else 'busy' if not st.motion_settled
        else '' -%}
    { ('Unload ' ~ what ~ '?') if not why else ('Nothing loaded' if why == 'empty' and lanes|length == 1 else (what ~ ' ' ~ why)) }
    {%- endif -%}
input: -1
input_min: -1
input_max: {(printer.oams_manager.topology.fps|length) - 1}
input_step: 1
gcode:
    {%- if menu.event == 'click' -%}
    {%- set m = printer.oams_manager -%}
    {%- set lanes = m.topology.fps -%}
    {%- set k = menu.input|int -%}
    {%- if k >= 0 and k < lanes|length -%}
    {%- set l = lanes[k] -%}
    {%- set st = m.lanes_by_fps[l] -%}
    {%- set why = 'not ready' if not m.ready
        else 'empty' if st.current_slot is none
        else 'busy' if not st.motion_settled
        else '' -%}
    {%- if not why -%}
    OPENAMS_UNLOAD FPS={l}
    {%- else -%}
    {action_respond_info('OpenAMS menu: lane ' ~ l ~ ' ' ~ why)}
    {%- endif -%}
    {%- endif -%}
    {%- endif -%}

[menu __main __openams __unload __nocut]
type: input
name:
    {%- set m = printer.oams_manager -%}
    {%- set lanes = m.topology.fps -%}
    {%- set k = menu.input|int -%}
    {%- if k < 0 or k >= lanes|length -%}
    Unload, no cut
    {%- else -%}
    {%- set l = lanes[k] -%}
    {%- set st = m.lanes_by_fps[l] -%}
    {%- set what = st.group if st.group else l -%}
    {%- set why = 'not ready' if not m.ready
        else 'empty' if st.op != 'LOADED'
        else 'busy' if not st.motion_settled
        else '' -%}
    { (what ~ ', no cut?') if not why else ('Nothing loaded' if why == 'empty' and lanes|length == 1 else (what ~ ' ' ~ why)) }
    {%- endif -%}
input: -1
input_min: -1
input_max: {(printer.oams_manager.topology.fps|length) - 1}
input_step: 1
gcode:
    {%- if menu.event == 'click' -%}
    {%- set m = printer.oams_manager -%}
    {%- set lanes = m.topology.fps -%}
    {%- set k = menu.input|int -%}
    {%- if k >= 0 and k < lanes|length -%}
    {%- set l = lanes[k] -%}
    {%- set st = m.lanes_by_fps[l] -%}
    {%- set why = 'not ready' if not m.ready
        else 'empty' if st.op != 'LOADED'
        else 'busy' if not st.motion_settled
        else '' -%}
    {%- if not why -%}
    OAMSM_UNLOAD_FROM_TOOLHEAD FPS={l}
    {%- else -%}
    {action_respond_info('OpenAMS menu: lane ' ~ l ~ ' ' ~ why)}
    {%- endif -%}
    {%- endif -%}
    {%- endif -%}

# OAMS_UNLOAD_SPOOL is a command of the AMS units (src/oams.py): a klipper-mmu
# unit's "unload" is the lane unload above, so only an AMS family rewinds here.
[menu __main __openams __unload __rewind]
type: input
name:
    {%- set m = printer.oams_manager -%}
    {%- set k = menu.input|int -%}
    {%- if k < 0 or k >= m.units|length -%}
    Rewind
    {%- else -%}
    {%- set u = m.units[k] -%}
    {%- set lane = m.lanes_by_fps[u.lane] -%}
    {%- set mine = lane.unit is not none and lane.unit[0] == u.id|int -%}
    {%- set why = 'not ready' if not m.ready
        else 'n/a' if m.topology.oams[u.name].family not in ['ams1', 'ams2', 'ams_ht'] or 'unload' not in m.devices[u.name].supported_actions|default([])
        else 'idle' if not mine
        else 'busy' if not lane.motion_settled
        else '' -%}
    { ('Rewind ' ~ u.name[:6] ~ ' ' ~ (lane.unit[1] + 1) ~ '?') if not why else (u.name[:6] ~ ' ' ~ why) }
    {%- endif -%}
input: -1
input_min: -1
input_max: {(printer.oams_manager.units|length) - 1}
input_step: 1
gcode:
    {%- if menu.event == 'click' -%}
    {%- set m = printer.oams_manager -%}
    {%- set k = menu.input|int -%}
    {%- if k >= 0 and k < m.units|length -%}
    {%- set u = m.units[k] -%}
    {%- set lane = m.lanes_by_fps[u.lane] -%}
    {%- set mine = lane.unit is not none and lane.unit[0] == u.id|int -%}
    {%- set why = 'not ready' if not m.ready
        else 'n/a' if m.topology.oams[u.name].family not in ['ams1', 'ams2', 'ams_ht'] or 'unload' not in m.devices[u.name].supported_actions|default([])
        else 'idle' if not mine
        else 'busy' if not lane.motion_settled
        else '' -%}
    {%- if not why -%}
    OAMS_UNLOAD_SPOOL OAMS={u.id} SPOOL={lane.unit[1]}
    {%- else -%}
    {action_respond_info('OpenAMS menu: ' ~ u.name ~ ' ' ~ why)}
    {%- endif -%}
    {%- endif -%}
    {%- endif -%}

### Extrude ###

# The hand purge after a load, in place of the stock Filament list and Move E
# that the host takes out where OpenAMS runs. Forward only, and only hot.
[menu __main __openams __extrude]
type: command
enable: {not ('print_stats' in printer and printer.print_stats.state == 'printing')}
name: {'Extrude 10mm' if printer[printer.toolhead.extruder].can_extrude else 'Extrude (cold)'}
gcode:
    {%- if printer[printer.toolhead.extruder].can_extrude -%}
    SAVE_GCODE_STATE NAME=_oams_menu_extrude
    M83
    G1 E10 F240
    RESTORE_GCODE_STATE NAME=_oams_menu_extrude
    {%- else -%}
    {action_respond_info('OpenAMS menu: heat the nozzle before extruding')}
    {%- endif -%}

### Recovery ###

[menu __main __openams __retry]
type: input
enable:
    {%- set n = namespace(v=false) -%}
    {%- for st in printer.oams_manager.lanes_by_fps.values() if st.toolchange_fault|default(none) is not none -%}{%- set n.v = true -%}{%- endfor -%}
    { n.v and not ('print_stats' in printer and printer.print_stats.state == 'printing') }
name:
    {%- set m = printer.oams_manager -%}
    {%- set lanes = m.topology.fps -%}
    {%- set k = menu.input|int -%}
    {%- if k < 0 or k >= lanes|length -%}
    Retry
    {%- else -%}
    {%- set l = lanes[k] -%}
    {%- set f = m.lanes_by_fps[l].toolchange_fault|default(none) -%}
    {%- if f is none -%}
    { 'Nothing failed' if lanes|length == 1 else (l ~ ' no fault') }
    {%- elif f.kind == 'unload' -%}
    { 'Retry unload?' if lanes|length == 1 else ('Retry ' ~ l ~ '?') }
    {%- else -%}
    { 'Retry ' ~ (f.group if f.group else l) ~ '?' }
    {%- endif -%}
    {%- endif -%}
input: -1
input_min: -1
input_max: {(printer.oams_manager.topology.fps|length) - 1}
input_step: 1
gcode:
    {%- if menu.event == 'click' -%}
    {%- set m = printer.oams_manager -%}
    {%- set lanes = m.topology.fps -%}
    {%- set k = menu.input|int -%}
    {%- if k >= 0 and k < lanes|length -%}
    {%- set l = lanes[k] -%}
    {%- if m.lanes_by_fps[l].toolchange_fault|default(none) is not none -%}
    OAMSM_RETRY FPS={l}
    {%- else -%}
    {action_respond_info('OpenAMS menu: nothing failed on lane ' ~ l)}
    {%- endif -%}
    {%- endif -%}
    {%- endif -%}

