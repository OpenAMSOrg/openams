### Follower ###

[menu __main __openams __follower]
type: list
enable: {not ('print_stats' in printer and printer.print_stats.state == 'printing')}
name: Follower

[menu __main __openams __follower __on]
type: input
name:
    {%- set m = printer.oams_manager -%}
    {%- set lanes = m.topology.fps -%}
    {%- set k = menu.input|int -%}
    {%- if k < 0 or k >= lanes|length -%}
    Follower on
    {%- else -%}
    {%- set l = lanes[k] -%}
    {%- set st = m.lanes_by_fps[l] -%}
    {%- set what = st.group if st.group else l -%}
    {%- set why = 'empty' if st.op != 'LOADED'
        else 'busy' if st.runout != 'idle'
        else '' -%}
    { ('Follow ' ~ what ~ '?') if not why else ('Nothing loaded' if why == 'empty' and lanes|length == 1 else (what ~ ' ' ~ why)) }
    {%- endif -%}
input: -1
input_min: -1
input_max: {(printer.oams_manager.topology.fps|length) - 1}
input_step: 1
gcode:
    {%- if menu.event == 'click' -%}
    {%- set m = printer.oams_manager -%}
    {%- set lanes = m.topology.fps -%}
    {%- set k = menu.input|int -%}
    {%- if k >= 0 and k < lanes|length -%}
    {%- set l = lanes[k] -%}
    {%- set st = m.lanes_by_fps[l] -%}
    {%- set why = 'empty' if st.op != 'LOADED'
        else 'busy' if st.runout != 'idle'
        else '' -%}
    {%- if not why -%}
    OAMSM_FOLLOWER ENABLE=1 DIRECTION=1 FPS={l}
    {%- else -%}
    {action_respond_info('OpenAMS menu: lane ' ~ l ~ ' ' ~ why)}
    {%- endif -%}
    {%- endif -%}
    {%- endif -%}

[menu __main __openams __follower __off]
type: command
name: Follower off
gcode: OAMSM_FOLLOWER ENABLE=0 DIRECTION=0

