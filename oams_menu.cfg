    {n.v}
name: Dryer

[menu __main __openams __dryer __temp]
type: input
name: Dry temp: {'%d' % menu.input}C
input: {printer['gcode_macro _OAMS_MENU'].dryer_temp}
input_min:
    {%- set n = namespace(v=none) -%}
    {%- for d in printer.oams_manager.devices.values() if d.dryer|default(none) is not none -%}
    {%- set lo = d.capabilities.dryer_target_min_c or 30 -%}
    {%- set n.v = lo if n.v is none or lo < n.v else n.v -%}
    {%- endfor -%}
    {n.v if n.v is not none else 30}
input_max:
    {%- set n = namespace(v=none) -%}
    {%- for d in printer.oams_manager.devices.values() if d.dryer|default(none) is not none -%}
    {%- set hi = d.capabilities.dryer_target_max_c or 80 -%}
    {%- set n.v = hi if n.v is none or hi > n.v else n.v -%}
    {%- endfor -%}
    {n.v if n.v is not none else 80}
input_step: 5
gcode:
    {%- if menu.event == 'click' -%}
    SET_GCODE_VARIABLE MACRO=_OAMS_MENU VARIABLE=dryer_temp VALUE={menu.input|int}
    {%- endif -%}

[menu __main __openams __dryer __time]
type: input
name: Dry time: {'%d' % menu.input}h
