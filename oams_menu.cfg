### Dryer ###

[menu __main __openams __dryer]
type: list
enable:
    {%- set n = namespace(v=false) -%}
    {%- for d in printer.oams_manager.devices.values() if d.dryer|default(none) is not none -%}{%- set n.v = true -%}{%- endfor -%}
    {n.v}
name: Dryer

# A preset starts at once: during a print it runs at the preset's print-time
# temperature, and a preset with none is not offered then ("idle only").
[menu __main __openams __dryer __start]
type: input
name:
    {%- set m = printer.oams_manager -%}
    {%- set cfg = printer['gcode_macro _OAMS_MENU'] -%}
    {%- set printing = 'print_stats' in printer and printer.print_stats.state == 'printing' -%}
    {%- set pairs = namespace(v=[], units=0) -%}
    {%- for u in m.units if m.devices[u.name].dryer|default(none) is not none -%}
    {%- set own = 'dryer_presets_' ~ (u.name|lower) -%}
    {%- set fam = 'dryer_presets_' ~ m.topology.oams[u.name].family -%}
    {%- set pairs.units = pairs.units + 1 -%}
    {%- for p in (cfg[own] if own in cfg else cfg[fam] if fam in cfg else []) -%}{%- set pairs.v = pairs.v + [[u, p]] -%}{%- endfor -%}
    {%- endfor -%}
    {%- set k = menu.input|int -%}
    {%- if k < 0 or k >= pairs.v|length -%}
    Start dryer
    {%- else -%}
    {%- set u = pairs.v[k][0] -%}
    {%- set p = pairs.v[k][1] -%}
    {%- set dev = m.devices[u.name] -%}
    {%- set lo = dev.capabilities.dryer_target_min_c or 30 -%}
    {%- set hi = dev.capabilities.dryer_target_max_c or 80 -%}
    {%- set want = p[3] if printing else p[1] -%}
    {%- set t = [[want, lo]|max, hi]|min if want is not none else none -%}
    {%- set why = 'idle only' if t is none
        else 'no power' if dev.dryer.adapter is sameas false
        else 'drying' if dev.dryer.state in ['preheat', 'hold', 'timed_dry', 'cooldown']
        else '' if 'dryer_start' in dev.supported_actions|default([])
        else 'loaded' if dev.capabilities.dryer_requires_unloaded
        else 'n/a' -%}
    {%- if why -%}
    { (p[0] ~ ' ' ~ why) if pairs.units == 1 else (u.name[:4] ~ ' ' ~ p[0] ~ ' ' ~ why) }
    {%- elif pairs.units == 1 -%}
    { p[0] ~ ' ' ~ t|int ~ 'C ' ~ p[2]|int ~ 'h?' }
    {%- else -%}
    { u.name[:4] ~ ' ' ~ p[0] ~ ' ' ~ t|int ~ 'C?' }
    {%- endif -%}
    {%- endif -%}
input: -1
input_min: -1
input_max:
    {%- set m = printer.oams_manager -%}
    {%- set cfg = printer['gcode_macro _OAMS_MENU'] -%}
    {%- set printing = 'print_stats' in printer and printer.print_stats.state == 'printing' -%}
    {%- set pairs = namespace(v=[], units=0) -%}
    {%- for u in m.units if m.devices[u.name].dryer|default(none) is not none -%}
    {%- set own = 'dryer_presets_' ~ (u.name|lower) -%}
    {%- set fam = 'dryer_presets_' ~ m.topology.oams[u.name].family -%}
    {%- set pairs.units = pairs.units + 1 -%}
    {%- for p in (cfg[own] if own in cfg else cfg[fam] if fam in cfg else []) -%}{%- set pairs.v = pairs.v + [[u, p]] -%}{%- endfor -%}
    {%- endfor -%}
    {pairs.v|length - 1}
input_step: 1
gcode:
    {%- if menu.event == 'click' -%}
    {%- set m = printer.oams_manager -%}
    {%- set cfg = printer['gcode_macro _OAMS_MENU'] -%}
    {%- set printing = 'print_stats' in printer and printer.print_stats.state == 'printing' -%}
    {%- set pairs = namespace(v=[], units=0) -%}
    {%- for u in m.units if m.devices[u.name].dryer|default(none) is not none -%}
    {%- set own = 'dryer_presets_' ~ (u.name|lower) -%}
    {%- set fam = 'dryer_presets_' ~ m.topology.oams[u.name].family -%}
    {%- set pairs.units = pairs.units + 1 -%}
    {%- for p in (cfg[own] if own in cfg else cfg[fam] if fam in cfg else []) -%}{%- set pairs.v = pairs.v + [[u, p]] -%}{%- endfor -%}
    {%- endfor -%}
    {%- set k = menu.input|int -%}
    {%- if k >= 0 and k < pairs.v|length -%}
    {%- set u = pairs.v[k][0] -%}
    {%- set p = pairs.v[k][1] -%}
    {%- set dev = m.devices[u.name] -%}
    {%- set lo = dev.capabilities.dryer_target_min_c or 30 -%}
    {%- set hi = dev.capabilities.dryer_target_max_c or 80 -%}
    {%- set want = p[3] if printing else p[1] -%}
    {%- set t = [[want, lo]|max, hi]|min if want is not none else none -%}
    {%- set why = 'idle only' if t is none
        else 'no power' if dev.dryer.adapter is sameas false
        else 'drying' if dev.dryer.state in ['preheat', 'hold', 'timed_dry', 'cooldown']
        else '' if 'dryer_start' in dev.supported_actions|default([])
        else 'loaded' if dev.capabilities.dryer_requires_unloaded
        else 'n/a' -%}
    {%- if not why -%}
    OAMS_DRYER_START OAMS={u.id} TARGET={t|int} DURATION={(p[2] * 3600)|int}
    {%- else -%}
    {action_respond_info('OpenAMS menu: ' ~ u.name ~ ' ' ~ p[0] ~ ' ' ~ why)}
    {%- endif -%}
    {%- endif -%}
    {%- endif -%}

[menu __main __openams __dryer __stop]
type: input
name:
    {%- set m = printer.oams_manager -%}
    {%- set d = namespace(v=[]) -%}
    {%- for u in m.units if m.devices[u.name].dryer|default(none) is not none -%}{%- set d.v = d.v + [u] -%}{%- endfor -%}
    {%- set k = menu.input|int -%}
    {%- if k < 0 or k >= d.v|length -%}
    Stop dryer
    {%- else -%}
    {%- set u = d.v[k] -%}
    {%- set dev = m.devices[u.name] -%}
    {%- set why = 'n/a' if 'dryer_stop' not in dev.supported_actions|default([])
        else '' if dev.dryer.state in ['preheat', 'hold', 'timed_dry', 'cooldown']
        else 'is off' -%}
    { ('Stop ' ~ u.name[:6] ~ ((' ' ~ dev.dryer.target_c|int ~ 'C') if dev.dryer.target_c is not none else '') ~ '?') if not why else (u.name[:6] ~ ' ' ~ why) }
    {%- endif -%}
input: -1
input_min: -1
input_max:
    {%- set n = namespace(v=0) -%}
    {%- for d in printer.oams_manager.devices.values() if d.dryer|default(none) is not none -%}{%- set n.v = n.v + 1 -%}{%- endfor -%}
    {n.v - 1}
input_step: 1
gcode:
    {%- if menu.event == 'click' -%}
    {%- set m = printer.oams_manager -%}
    {%- set d = namespace(v=[]) -%}
    {%- for u in m.units if m.devices[u.name].dryer|default(none) is not none -%}{%- set d.v = d.v + [u] -%}{%- endfor -%}
    {%- set k = menu.input|int -%}
    {%- if k >= 0 and k < d.v|length -%}
    {%- set u = d.v[k] -%}
    {%- set dev = m.devices[u.name] -%}
    {%- set why = 'n/a' if 'dryer_stop' not in dev.supported_actions|default([])
        else '' if dev.dryer.state in ['preheat', 'hold', 'timed_dry', 'cooldown']
        else 'is off' -%}
    {%- if not why -%}
    OAMS_DRYER_STOP OAMS={u.id}
    {%- else -%}
    {action_respond_info('OpenAMS menu: ' ~ u.name ~ ' dryer ' ~ why)}
    {%- endif -%}
    {%- endif -%}
    {%- endif -%}

# Your own temperature and time: set Dry temp and Dry time, then Start custom.
[menu __main __openams __dryer __custom]
type: list
name: Custom

[menu __main __openams __dryer __custom __temp]
type: input
name: Dry temp: {'%d' % menu.input}C
input: {printer['gcode_macro _OAMS_MENU'].dryer_temp}
input_min:
    {%- set n = namespace(v=none) -%}
    {%- for d in printer.oams_manager.devices.values() if d.dryer|default(none) is not none -%}
    {%- set lo = d.capabilities.dryer_target_min_c or 30 -%}
    {%- set n.v = lo if n.v is none or lo < n.v else n.v -%}
    {%- endfor -%}
    {n.v if n.v is not none else 30}
input_max:
    {%- set n = namespace(v=none) -%}
    {%- for d in printer.oams_manager.devices.values() if d.dryer|default(none) is not none -%}
    {%- set hi = d.capabilities.dryer_target_max_c or 80 -%}
    {%- set n.v = hi if n.v is none or hi > n.v else n.v -%}
    {%- endfor -%}
    {n.v if n.v is not none else 80}
input_step: 5
gcode:
    {%- if menu.event == 'click' -%}
    SET_GCODE_VARIABLE MACRO=_OAMS_MENU VARIABLE=dryer_temp VALUE={menu.input|int}
    {%- endif -%}

[menu __main __openams __dryer __custom __time]
type: input
name: Dry time: {'%d' % menu.input}h
input: {printer['gcode_macro _OAMS_MENU'].dryer_hours}
input_min: 1
input_max: 72
input_step: 1
gcode:
    {%- if menu.event == 'click' -%}
    SET_GCODE_VARIABLE MACRO=_OAMS_MENU VARIABLE=dryer_hours VALUE={menu.input|int}
    {%- endif -%}

