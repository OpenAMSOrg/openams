input_min: 1
input_max: 24
input_step: 1
gcode:
    {%- if menu.event == 'click' -%}
    SET_GCODE_VARIABLE MACRO=_OAMS_MENU VARIABLE=dryer_hours VALUE={menu.input|int}
    {%- endif -%}

[menu __main __openams __dryer __start]
type: input
name:
    {%- set m = printer.oams_manager -%}
    {%- set d = namespace(v=[]) -%}
    {%- for u in m.units if m.devices[u.name].dryer|default(none) is not none -%}{%- set d.v = d.v + [u] -%}{%- endfor -%}
    {%- set k = menu.input|int -%}
    {%- if k < 0 or k >= d.v|length -%}
    Start dryer
    {%- else -%}
    {%- set u = d.v[k] -%}
    {%- set dev = m.devices[u.name] -%}
    {%- set cfg = printer['gcode_macro _OAMS_MENU'] -%}
    {%- set lo = dev.capabilities.dryer_target_min_c or 30 -%}
    {%- set hi = dev.capabilities.dryer_target_max_c or 80 -%}
    {%- set t = [[cfg.dryer_temp, lo]|max, hi]|min -%}
    {%- set why = 'no power' if dev.dryer.adapter is sameas false
        else 'drying' if dev.dryer.state in ['preheat', 'hold', 'timed_dry', 'cooldown']
        else '' if 'dryer_start' in dev.supported_actions|default([])
        else 'loaded' if dev.capabilities.dryer_requires_unloaded
        else 'n/a' -%}
    { (u.name[:6] ~ ' ' ~ t|int ~ 'C ' ~ cfg.dryer_hours|int ~ 'h?') if not why else (u.name[:6] ~ ' ' ~ why) }
    {%- endif -%}
input: -1
input_min: -1
input_max:
    {%- set n = namespace(v=0) -%}
    {%- for d in printer.oams_manager.devices.values() if d.dryer|default(none) is not none -%}{%- set n.v = n.v + 1 -%}{%- endfor -%}
    {n.v - 1}
input_step: 1
gcode:
    {%- if menu.event == 'click' -%}
    {%- set m = printer.oams_manager -%}
    {%- set d = namespace(v=[]) -%}
    {%- for u in m.units if m.devices[u.name].dryer|default(none) is not none -%}{%- set d.v = d.v + [u] -%}{%- endfor -%}
    {%- set k = menu.input|int -%}
    {%- if k >= 0 and k < d.v|length -%}
    {%- set u = d.v[k] -%}
    {%- set dev = m.devices[u.name] -%}
    {%- set cfg = printer['gcode_macro _OAMS_MENU'] -%}
    {%- set lo = dev.capabilities.dryer_target_min_c or 30 -%}
    {%- set hi = dev.capabilities.dryer_target_max_c or 80 -%}
    {%- set t = [[cfg.dryer_temp, lo]|max, hi]|min -%}
    {%- set why = 'no power' if dev.dryer.adapter is sameas false
        else 'drying' if dev.dryer.state in ['preheat', 'hold', 'timed_dry', 'cooldown']
        else '' if 'dryer_start' in dev.supported_actions|default([])
        else 'loaded' if dev.capabilities.dryer_requires_unloaded
        else 'n/a' -%}
    {%- if not why -%}
    OAMS_DRYER_START OAMS={u.id} TARGET={t|int} DURATION={(cfg.dryer_hours * 3600)|int}
    {%- else -%}
    {action_respond_info('OpenAMS menu: ' ~ u.name ~ ' ' ~ why)}
    {%- endif -%}
    {%- endif -%}
    {%- endif -%}

[menu __main __openams __dryer __stop]
